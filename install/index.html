<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Install the KOR HVAC app</title><link rel="icon" href="/favicon.svg">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f3f5f9;color:#1b2333}
header{background:#111;color:#fff;padding:18px 16px;text-align:center}header img{height:44px}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}h1{font-size:24px;margin:6px 0 4px}.sub{color:#6b7488;margin:0 0 16px}
.card{background:#fff;border:1px solid #e3e7ef;border-radius:14px;padding:18px;margin-bottom:14px}
.app{display:flex;gap:14px;align-items:center}.app img{width:64px;height:64px;border-radius:14px}
.btn{display:block;text-align:center;background:#111;color:#fff;text-decoration:none;font-weight:700;padding:15px;border-radius:12px;margin-top:14px;font-size:17px;border:0;width:100%}
.btn.sec{background:#fff;color:#111;border:1px solid #111}
ol{padding-left:20px;margin:8px 0 0}li{margin:8px 0;line-height:1.45}.k{display:inline-block;background:#eef1f6;border-radius:6px;padding:1px 7px;font-weight:700}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid #d6dbe4;background:#fff;font-weight:700}.tabs button.on{background:#111;color:#fff;border-color:#111}
.note{font-size:13px;color:#6b7488}
</style></head><body>
<header><img src="/email/logo.png" alt="KOR HVAC"></header>
<main id="m"></main>
<script>
const STAFF={name:'KOR HVAC',who:'For the whole team — sign in and it opens the right screens for you (technician, office, rebate).',url:'/app/'};
const APPS={tech:STAFF,office:STAFF,staff:STAFF,
 portal:{name:'KOR HVAC Customer Portal',who:'For customers — proposals, invoices, service history and requests.',url:'/portal/'}};
const qp=new URLSearchParams(location.search);let key=APPS[qp.get('app')]?qp.get('app'):'staff';
const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),android=/Android/.test(ua);
let os=ios?'ios':android?'android':'ios';
const safariIOS=ios&&!/CriOS|FxiOS|EdgiOS/.test(ua);
function steps(){const a=APPS[key],full=location.origin+a.url;
 if(os==='ios')return `<ol>
  ${safariIOS?'':`<li><b>Open this page in Safari</b> (iPhone only lets you add apps to the Home Screen from Safari). <button class="btn sec" style="margin-top:8px;padding:10px" onclick="copyLink()">Copy link to paste in Safari</button></li>`}
  <li>Tap <b>Open the app</b> below.</li>
  <li>Tap the <span class="k">Share</span> button <b>⎋</b> at the bottom (square with an arrow up).</li>
  <li>Scroll down and tap <span class="k">Add to Home Screen</span>, then <span class="k">Add</span>.</li>
  <li>Open <b>${a.name}</b> from your Home Screen — it works like a regular app.</li></ol>`;
 return `<ol><li>Tap <b>Open the app</b> below (in Chrome).</li>
  <li>Tap the <span class="k">⋮</span> menu at the top right.</li>
  <li>Tap <span class="k">Install app</span> (or <span class="k">Add to Home screen</span>), then <span class="k">Install</span>.</li>
  <li>Open <b>${a.name}</b> from your apps — it works like a regular app.</li></ol>`}
function draw(){const a=APPS[key];document.getElementById('m').innerHTML=`
 <h1>Install the app</h1><p class="sub">No App Store or Google Play needed — about 20 seconds.</p>
 <div class="card"><div class="app"><img src="${a.url}icon-512.png" alt=""><div><b style="font-size:18px">${a.name}</b><div class="note">${a.who}</div></div></div>
  <div class="tabs"><button class="${os==='ios'?'on':''}" onclick="os='ios';draw()"> iPhone</button><button class="${os==='android'?'on':''}" onclick="os='android';draw()">🤖 Android</button></div>
  ${steps()}
  <a class="btn" href="${a.url}">Open the app</a></div>
 <p class="note" style="text-align:center">Already installed? Just open it from your Home Screen. Questions? Call (718) 688-9359.</p>`}
function copyLink(){navigator.clipboard&&navigator.clipboard.writeText(location.href).then(()=>alert('Link copied — open Safari and paste it in the address bar.'))}
draw();
</script></body></html>
