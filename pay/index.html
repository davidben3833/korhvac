<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pay invoice · KOR HVAC</title><link rel="icon" href="/favicon.svg"><meta name="robots" content="noindex">
<style>
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f9;color:#1b2430}
.w{max-width:520px;margin:0 auto;padding:28px 16px}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px;margin-bottom:18px}.logo span{color:#e4572e}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:22px}
h1{font-size:20px;margin:0 0 4px}.mut{color:#6b7684;font-size:14px}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}td{padding:7px 0;border-bottom:1px solid #eef0f3;vertical-align:top}td.r{text-align:right;white-space:nowrap}
.tot{display:flex;justify-content:space-between;font-size:15px;margin-top:6px}.big{font-size:26px;font-weight:800}
button{width:100%;margin-top:18px;padding:15px;border:0;border-radius:10px;background:#1b2430;color:#fff;font-size:17px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}
.ok{background:#e7f6ee;color:#1f7a45;border-radius:10px;padding:14px;margin-top:14px;font-weight:600}.err{background:#fde8e8;color:#9b1c1c;border-radius:10px;padding:14px;margin-top:14px}
.small{font-size:12px;color:#8a94a3;margin-top:14px;text-align:center}
</style></head><body><div class="w"><div class="logo">KOR <span>HVAC</span></div><div class="card" id="c"><div class="mut">Loading invoice…</div></div>
<div class="small">Payments are processed securely by Stripe. KOR HVAC never sees your card or bank details.</div></div>
<script>
const FN='https://bljdqwbbcfgouuekcqxl.supabase.co/functions/v1/stripe-pay';
const q=new URLSearchParams(location.search),t=q.get('t')||'';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(+n||0).toLocaleString('en-US',{style:'currency',currency:'USD'});
const call=b=>fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:t,...b})}).then(r=>r.json());
(async()=>{const d=await call({action:'view'}).catch(()=>({error:'Could not load the invoice'}));
 if(d.error){$('#c').innerHTML=`<div class="err">${esc(d.error)}</div>`;return}
 const paidNow=q.get('paid')==='1';
 $('#c').innerHTML=`<h1>Invoice ${esc(d.number)}</h1><div class="mut">${esc(d.customer)}${d.due?' · due '+esc(new Date(d.due+'T12:00').toLocaleDateString()):''}</div>
  <table>${(d.items||[]).map(i=>`<tr><td>${esc(i.desc)}${+i.qty!==1?` <span class="mut">× ${esc(i.qty)}</span>`:''}</td><td class="r">${money((+i.qty||0)*(+i.price||0))}</td></tr>`).join('')}</table>
  ${d.tax_label==='exempt'?`<div class="tot"><span>Sales tax</span><span>exempt</span></div>`:''}${+d.tax_rate?`<div class="tot"><span>Sales tax (${esc(d.tax_rate)}%${d.tax_label?' · '+esc(d.tax_label):''})</span><span>${money(d.total-(d.items||[]).reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0))}</span></div>`:''}
  <div class="tot"><span>Total</span><span>${money(d.total)}</span></div>${d.paid?`<div class="tot"><span>Paid</span><span>− ${money(d.paid)}</span></div>`:''}
  <div class="tot" style="margin-top:12px"><span style="font-weight:700">Balance due</span><span class="big">${money(d.balance)}</span></div>
  ${paidNow?`<div class="ok">✓ Thank you! Your payment was received${d.balance>0?' — bank (ACH) payments show here once they clear, usually in 2–4 business days':''}.</div>`:''}
  ${d.balance>0&&!paidNow?`<button id="bank" data-m="bank">Pay ${money(d.balance)} by bank account (ACH) — no fee</button>
   <button id="card" data-m="card" style="background:#fff;color:#1b2430;border:2px solid #1b2430">Pay ${money(d.balance+(+d.card_fee||0))} by credit/debit card${+d.card_fee?`<div style="font-size:13px;font-weight:500;margin-top:3px">includes ${esc(d.card_fee_pct)}% card processing fee (${money(d.card_fee)})</div>`:''}</button>`:d.balance<=0?'<div class="ok">✓ This invoice is paid in full. Thank you!</div>':''}<div id="m"></div>`;
 document.querySelectorAll('button[data-m]').forEach(b=>b.onclick=async()=>{const h=b.innerHTML;document.querySelectorAll('button[data-m]').forEach(x=>x.disabled=true);b.textContent='Opening secure checkout…';const r=await call({action:'checkout',method:b.dataset.m}).catch(()=>({error:'Something went wrong — please try again'}));if(r.url)location.href=r.url;else{$('#m').innerHTML=`<div class="err">${esc(r.error)}</div>`;document.querySelectorAll('button[data-m]').forEach(x=>x.disabled=false);b.innerHTML=h}})})();
</script></body></html>
