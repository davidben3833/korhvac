function jobService(jobId){const j=jobId&&byId('jobs',jobId);if(!j)return null;const log=(j.timeLog||[]).filter(t=>t.in);if(!log.length)return{j,rows:[],start:null,finish:null,hrs:0,billed:0};
  const rows=log.map(t=>({tech:techName(t.techId),in:t.in,out:t.out,h:hrs(t.in,t.out)}));
  const start=log.map(t=>t.in).sort()[0];const outs=log.map(t=>t.out).filter(Boolean).sort();const finish=outs.length===log.length?outs[outs.length-1]:null;
  return{j,rows,start,finish,hrs:rows.reduce((a,r)=>a+r.h,0),billed:laborHrs(j)}}
const ftm=iso=>iso?new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}):'—';
const fdur=h=>{const m=Math.round(h*60);return `${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`};
function invDoc(i){const c=byId('customers',i.customerId)||{},co=company(),t=calc(i.items,i.taxRate);const sv=jobService(i.jobId);const j=sv&&sv.j;
  const site=i.site||(j&&j.site)||c.address||'';
  return `<div class="invdoc">
  <div class="ih"><div>${INV_LOGO}</div><div class="r"><div class="it">INVOICE</div><div><b>${esc(i.number)}</b></div><div>Date: ${fdate(i.date)}</div><div>Due: ${fdate(i.due)}</div>${i.po?`<div>PO: ${esc(i.po)}</div>`:''}${i.jobNumber?`<div>Job: ${esc(i.jobNumber)}</div>`:''}</div></div>
  <div class="ic"><b>${esc(co.name||'KOR HVAC LLC')}</b><br>${esc(co.address||'').replace(/\n/g,'<br>')}${co.phone?'<br>'+esc(co.phone):''}${co.email?' · '+esc(co.email):''}${co.license?'<br>Lic# '+esc(co.license):''}</div>
  <div class="ib"><div><div class="il">Bill to</div><b>${esc(c.company||c.name||'')}</b>${c.company&&c.name&&c.name!==c.company?'<br>'+esc(c.name):''}${c.address?'<br>'+esc(c.address):''}${c.billEmail||c.email?'<br>'+esc(c.billEmail||c.email):''}</div>
   ${site?`<div><div class="il">Service location</div>${esc(site)}</div>`:''}</div>
  ${j?`<div class="il" style="margin-top:14px">Service details</div><table class="isv"><tr><td>Service date</td><td><b>${fdate(j.date||(sv.start||'').slice(0,10))}</b></td><td>Job</td><td><b>${esc(j.number)}</b> · ${esc(j.type||'')}</td></tr>
   ${sv.rows.length?`<tr><td>Arrived / started</td><td><b>${ftm(sv.start)}</b></td><td>Finished</td><td><b>${sv.finish?ftm(sv.finish):'in progress'}</b></td></tr>
   <tr><td>Total time on site</td><td><b>${fdur(sv.hrs)}</b></td><td>Labor billed</td><td><b>${sv.billed.toFixed(2)} h</b> <span class="mut">(1-hr minimum, then ½-hr increments)</span></td></tr>`:''}
   ${j.description?`<tr><td>Work requested</td><td colspan="3">${esc(j.description)}</td></tr>`:''}${j.notes?`<tr><td>Work performed</td><td colspan="3">${esc(j.notes).replace(/\n/g,'<br>')}</td></tr>`:''}</table>
   ${sv.rows.length>1?`<table class="isv small"><tr><th>Technician</th><th>In</th><th>Out</th><th class="r">Time</th></tr>${sv.rows.map(r=>`<tr><td>${esc(r.tech)}</td><td>${fdt(r.in)}</td><td>${r.out?fdt(r.out):'—'}</td><td class="r">${fdur(r.h)}</td></tr>`).join('')}</table>`:(sv.rows.length?`<div class="small mut">Technician: ${esc(sv.rows[0].tech)}</div>`:'')}`:''}
  ${i.notes&&!(j&&i.notes===j.description)?`<p>${esc(i.notes).replace(/\n/g,'<br>')}</p>`:''}
  <table class="iit"><tr><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr>${(i.items||[]).filter(x=>x.desc||+x.price).map(x=>`<tr><td>${esc(x.desc)}</td><td class="r">${esc(x.qty)}</td><td class="r">${money(x.price)}</td><td class="r">${money((+x.qty||0)*(+x.price||0))}</td></tr>`).join('')}</table>
  <div class="itot"><div><span>Subtotal</span><span>${money(t.sub)}</span></div>${+i.taxRate?`<div><span>Tax (${esc(i.taxRate)}%)</span><span>${money(t.tax)}</span></div>`:''}<div><span>Total</span><span>${money(t.total)}</span></div>${(i.payments||[]).map(p=>`<div class="mut"><span>Payment ${fdate(p.date)} ${esc(p.method||'')}</span><span>−${money(p.amount)}</span></div>`).join('')}<div class="ibal"><span>Balance due</span><span>${money(invBal(i))}</span></div></div>
  ${i.payLink?`<p>Pay online: <a href="${esc(i.payLink)}">${esc(i.payLink)}</a></p>`:''}${co.remit?`<p class="small">Remit to: ${esc(co.remit)}</p>`:''}
  <p class="mut small" style="margin-top:18px">${esc(co.invoiceFooter||'Thank you for your business!')}</p></div>`}
const INV_CSS=`.invdoc{font-family:Inter,Arial,sans-serif;color:#111;font-size:13px;line-height:1.45}.invdoc .ih{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.invdoc .r{text-align:right}.invdoc .it{font-size:26px;font-weight:800;letter-spacing:.06em}

.invdoc .iit{margin-top:16px}.invdoc .iit td{padding:7px 8px;border-bottom:1px solid #eee}.invdoc th.r,.invdoc td.r{text-align:right}.invdoc .itot{margin:12px 0 0 auto;width:280px}.invdoc .itot div{display:flex;justify-content:space-between;padding:3px 0}.invdoc .ibal{border-top:2px solid #111;margin-top:4px;padding-top:6px!important;font-weight:800;font-size:15px}.invdoc .mut{color:#777}.invdoc .small{font-size:11.5px}`;
function printInv(){syncInv();const i=edit.obj;const w=window.open('','_blank');if(!w){toast('Allow pop-ups to print');return}
  w.document.write(`<!DOCTYPE html><html><head><meta name="robots" content="noindex"><meta charset="utf-8"><title>Invoice ${esc(i.number)} – ${esc(company().name||'KOR HVAC')}</title><style>@page{margin:14mm}body{margin:0;padding:24px}${INV_CSS}@media print{body{padding:0}}</style></head><body>${invDoc(i)}<script>setTimeout(()=>window.print(),300)<\/script></body></html>`);w.document.close()}

function bars(rows,fmt=money){const max=Math.max(1,...rows.map(r=>r[1]));return rows.length?rows.map(([l,val,sub])=>`<div class="bar"><div class="lb" title="${esc(l)}">${esc(l)}</div><div class="tr"><div class="fl" style="width:${Math.max(1,val/max*100)}%"></div></div><div class="vl">${fmt(val)}${sub?`<div class="mut small" style="font-weight:400">${sub}</div>`:''}</div></div>`).join(''):'<div class="empty">No data in this range</div>'}
function vReports(){const f=UI.from,t=UI.to;
  const invs=S.invoices.filter(i=>i.status!=='Void'&&inRange(i.date,f,t));
  const rev=invs.reduce((a,i)=>a+calc(i.items,0).sub,0);const coll=S.invoices.flatMap(i=>i.payments||[]).filter(p=>inRange(p.date,f,t)).reduce((a,p)=>a+(+p.amount||0),0);
  const jobsDone=S.jobs.filter(j=>j.status==='Completed'&&inRange(j.completedAt||j.date,f,t));
  const jobInvRev=j=>{const i=byId('invoices',j.invoiceId);return i&&i.status!=='Void'?calc(i.items,0).sub:calc(j.items,0).sub};
  const avg=jobsDone.length?jobsDone.reduce((a,j)=>a+jobInvRev(j),0)/jobsDone.length:0;
  const ests=S.estimates.filter(e=>inRange(e.closedAt||e.sentAt||e.date,f,t)&&['Approved','Declined','Sent'].includes(e.status));
  const won=ests.filter(e=>e.status==='Approved');const close=ests.length?won.length/ests.length:NaN;
  const g=(arr,key,val)=>{const m={};arr.forEach(x=>{const k=key(x);m[k]=(m[k]||0)+val(x)});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const byTech=crew().map(tc=>{const js=jobsDone.filter(j=>j.techId===tc.id);const r=js.reduce((a,j)=>a+jobInvRev(j),0);return[tc.name,r,`${js.length} jobs · avg ${money(js.length?r/js.length:0)}`]}).sort((a,b)=>b[1]-a[1]);
  const byType=g(jobsDone,j=>j.type,jobInvRev);const byCust=g(invs,i=>custName(i.customerId),i=>calc(i.items,0).sub).slice(0,10);
  const costs=jobsDone.map(j=>({j,c:jobCost(j)}));const gm=costs.reduce((a,x)=>a+x.c.margin,0),gr=costs.reduce((a,x)=>a+x.c.rev,0);
  const callbacks=jobsDone.filter(j=>j.type==='Callback').length;
  const calls=S.calls.filter(c=>inRange(c.at,f,t));const booked=calls.filter(c=>['Booked','Quote'].includes(c.outcome)).length;
  return `<div class="top"><h1>Reports</h1><input type="date" value="${f}" onchange="UI.from=this.value;render()" style="max-width:160px"> to <input type="date" value="${t}" onchange="UI.to=this.value;render()" style="max-width:160px">
   <button class="sm" onclick="UI.from=today().slice(0,8)+'01';UI.to=today();render()">This month</button><button class="sm" onclick="UI.from=today().slice(0,4)+'-01-01';UI.to=today();render()">YTD</button></div>
  <div class="kpis"><div class="card kpi"><div class="l">Revenue invoiced</div><div class="v">${money(rev)}</div><div class="s">${invs.length} invoices (pre-tax)</div></div>
   <div class="card kpi"><div class="l">Collected</div><div class="v">${money(coll)}</div></div>
   <div class="card kpi"><div class="l">Jobs completed</div><div class="v">${jobsDone.length}</div><div class="s">${callbacks} callbacks</div></div>
   <div class="card kpi"><div class="l">Average ticket</div><div class="v">${money(avg)}</div></div>
   <div class="card kpi"><div class="l">Estimate close rate</div><div class="v">${pct(close)}</div><div class="s">${won.length} of ${ests.length} · ${money(won.reduce((a,e)=>a+estValue(e),0))} won</div></div>
   <div class="card kpi"><div class="l">Gross margin (jobs)</div><div class="v">${gr?pct(gm/gr):'—'}</div><div class="s">${money(gm)}</div></div>
   <div class="card kpi"><div class="l">Call booking rate</div><div class="v">${pct(calls.length?booked/calls.length:NaN)}</div><div class="s">${booked} of ${calls.length} calls</div></div></div>
  <div class="grid2"><div class="card"><h3>Revenue by Technician</h3>${bars(byTech)}</div><div class="card"><h3>Revenue by Job Type</h3>${bars(byType)}</div>
  <div class="card"><h3>Top Customers</h3>${bars(byCust)}</div>
  <div class="card"><h3>Lowest-Margin Jobs</h3>${costs.length?`<table class="small"><tr><th>Job</th><th>Customer</th><th class="r">Revenue</th><th class="r">Margin</th></tr>${costs.sort((a,b)=>(a.c.rev?a.c.margin/a.c.rev:0)-(b.c.rev?b.c.margin/b.c.rev:0)).slice(0,8).map(({j,c})=>`<tr class="click" onclick="openJob('${j.id}')"><td>${esc(j.number)}</td><td>${esc(custName(j.customerId))}</td><td class="r">${money(c.rev)}</td><td class="r" style="color:${c.margin<0?'var(--bad)':''}">${c.rev?pct(c.margin/c.rev):'—'}</td></tr>`).join('')}</table>`:'<div class="empty">No completed jobs</div>'}</div></div>
  <p class="mut small">Margin = revenue − part costs (from the Cost column) − labor (clocked hours × each tech's burdened cost rate).</p>`}

function vPayroll(){const f=UI.from,t=UI.to;
  const rows=crew().map(tc=>{let hrs=0;const weeks={};S.jobs.forEach(j=>(j.timeLog||[]).forEach(x=>{if(x.techId!==tc.id||!inRange(x.in,f,t))return;const h=((x.out?new Date(x.out):new Date())-new Date(x.in))/36e5;hrs+=h;const d=new Date(x.in);const wk=ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getDay()));weeks[wk]=(weeks[wk]||0)+h}));
   const ot=Object.values(weeks).reduce((a,h)=>a+Math.max(0,h-40),0);const reg=hrs-ot;const rate=+tc.payRate||0;
   const sold=S.jobs.filter(j=>j.techId===tc.id&&j.status==='Completed'&&inRange(j.completedAt||j.date,f,t)).reduce((a,j)=>{const i=byId('invoices',j.invoiceId);return a+(i&&i.status!=='Void'?calc(i.items,0).sub:calc(j.items,0).sub)},0);
   const comm=sold*(+tc.commission||0)/100;const gross=reg*rate+ot*rate*1.5+comm;return{tc,hrs,reg,ot,rate,sold,comm,gross}});
  return `<div class="top"><h1>Payroll & Commissions</h1><input type="date" value="${f}" onchange="UI.from=this.value;render()" style="max-width:160px"> to <input type="date" value="${t}" onchange="UI.to=this.value;render()" style="max-width:160px">
   <button onclick="exportCSV('payroll-${f}-to-${t}.csv',[['Technician','Regular Hrs','OT Hrs','Pay Rate','Regular Pay','OT Pay','Completed Revenue','Commission %','Commission','Gross Pay'],...window._pr.map(r=>[r.tc.name,r.reg.toFixed(2),r.ot.toFixed(2),r.rate,(r.reg*r.rate).toFixed(2),(r.ot*r.rate*1.5).toFixed(2),r.sold.toFixed(2),r.tc.commission||0,r.comm.toFixed(2),r.gross.toFixed(2)])])">⬇ Export for payroll</button></div>
  <div class="card" style="padding:0;overflow-x:auto">${rows.length?`<table><tr><th>Technician</th><th class="r">Reg hrs</th><th class="r">OT hrs</th><th class="r">Rate</th><th class="r">Hourly pay</th><th class="r">Completed revenue</th><th class="r">Comm %</th><th class="r">Commission</th><th class="r">Gross pay</th></tr>
  ${rows.map(r=>`<tr class="click" onclick="openTech('${r.tc.id}')"><td><b>${esc(r.tc.name)}</b></td><td class="r">${r.reg.toFixed(1)}</td><td class="r">${r.ot.toFixed(1)}</td><td class="r">${money(r.rate)}</td><td class="r">${money(r.reg*r.rate+r.ot*r.rate*1.5)}</td><td class="r">${money(r.sold)}</td><td class="r">${esc(r.tc.commission||0)}%</td><td class="r">${money(r.comm)}</td><td class="r"><b>${money(r.gross)}</b></td></tr>`).join('')}
  <tr><td><b>Total</b></td><td class="r">${rows.reduce((a,r)=>a+r.reg,0).toFixed(1)}</td><td class="r">${rows.reduce((a,r)=>a+r.ot,0).toFixed(1)}</td><td></td><td></td><td class="r">${money(rows.reduce((a,r)=>a+r.sold,0))}</td><td></td><td class="r">${money(rows.reduce((a,r)=>a+r.comm,0))}</td><td class="r"><b>${money(rows.reduce((a,r)=>a+r.gross,0))}</b></td></tr></table>`:'<div class="empty">Add technicians with pay rates first</div>'}</div>
  <p class="mut small">Hours come from techs clocking in/out on jobs. Overtime = over 40 hrs in a Sun–Sat week at 1.5×. Commission = tech's % × pre-tax revenue on completed jobs. This is a payroll prep sheet — run actual payroll in your payroll provider.</p>${(window._pr=rows,'')}`}

S.notifs=[];S.treqs=[];
async function loadNotifs(){if(!sb)return;const{data}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(60);S.notifs=data||[];drawBell()}
async function loadTreqs(){if(!sb)return;const{data}=await sb.from('time_requests').select('*').order('created_at',{ascending:false}).limit(500);S.treqs=data||[]}
function bellRealtime(){if(!sb)return;sb.channel('office-bell')
  .on('postgres_changes',{event:'*',schema:'public',table:'notifications'},()=>loadNotifs())

async function pbInline(id,f,inp){const p=byId('pricebook',id);if(!p)return;const n=inp.value.replace(/[$,\s]/g,'');if(n!==''&&!isFinite(+n)){toast('Enter a number');inp.value=+p[f]||'';return}

async function pbAdjust(preview){const sc=v('aj_scope'),how=v('aj_how'),val=+v('aj_val'),rd=v('aj_round');if(!isFinite(val)||v('aj_val')===''){toast('Enter a number');return}
  let items=sc==='shown'?pbList():sc==='all'?[...S.pricebook]:S.pricebook.filter(p=>p.category===sc.slice(4));
  const out=[];let skip=0;for(const p of items){const o={...p};
    if(how==='pct'){if(!(+p.price)){skip++;continue}o.price=pbRound(p.price*(1+val/100),rd)}
    else if(how==='cost'){if(!(+p.cost)){skip++;continue}o.cost=Math.round(p.cost*(1+val/100)*100)/100}
    else if(how==='markup'){if(!(+p.cost)||val<=0){skip++;continue}o.price=pbRound(p.cost*val,rd)}
    else{if(!(+p.cost)||val>=100||val<0){skip++;continue}o.price=pbRound(p.cost/(1-val/100),rd)}
    if(+o.price)o.needsPrice=false;if(o.price!==p.price||o.cost!==p.cost)out.push(o)}
  const ex=out.slice(0,5).map(o=>{const p=byId('pricebook',o.id);return `${esc(p.name)}: ${how==='cost'?money(p.cost)+' → '+money(o.cost)+' cost':money(p.price)+' → '+money(o.price)}`}).join('<br>');
  if(preview){el('aj_prev').innerHTML=`<b>${out.length} item(s) will change</b>${skip?` · ${skip} skipped (missing cost/price)`:''}<br>${ex}${out.length>5?'<br>…':''}`;return}

// approx. real-world combined MPG for common work trucks/vans — editable per truck
const MPG_DB={'Ford Transit':16,'Ford Transit Connect':24,'Ford E-Series':12,'Ford E-350':12,'Ford E-250':13,'Ford F-150':20,'Ford F-250':14,'Ford F-350':13,'Ford Ranger':22,'Ford Maverick':30,'Ford Escape':28,'Ford Explorer':22,
 'Chevrolet Express':13,'Chevrolet Silverado 1500':18,'Chevrolet Silverado 2500':13,'Chevrolet Silverado 3500':12,'Chevrolet Colorado':21,'Chevrolet Silverado':18,'GMC Savana':13,'GMC Sierra 1500':18,'GMC Sierra 2500':13,'GMC Sierra':18,'GMC Canyon':21,
 'Ram ProMaster':15,'Ram ProMaster City':24,'Ram 1500':19,'Ram 2500':13,'Ram 3500':12,'Mercedes-Benz Sprinter':18,'Mercedes-Benz Metris':20,
 'Nissan NV':13,'Nissan NV200':25,'Nissan Frontier':20,'Nissan Titan':17,'Toyota Tacoma':20,'Toyota Tundra':18,'Toyota Sienna':36,'Honda Ridgeline':21,'Honda Odyssey':22,'Jeep Gladiator':19,'Isuzu NPR':11};
function mpgGuess(make,model){const mk=(make||'').trim().toLowerCase().replace(/^chevy$/,'chevrolet').replace(/^mercedes$/,'mercedes-benz').replace(/^dodge$/,'ram');const md=(model||'').trim().toLowerCase().replace(/\s+/g,' ');if(!md)return null;
  let best=null,bs=0;for(const[n,m] of Object.entries(MPG_DB)){const i=n.indexOf(' ');const dm=n.slice(0,i).toLowerCase(),dmod=n.slice(i+1).toLowerCase();if(mk&&dm!==mk)continue;
    const s=md.includes(dmod)?1000+dmod.length:dmod.startsWith(md)?500-dmod.length:0;if(s>bs){bs=s;best=m}}return best}
const numOr=(x,d)=>x===''||x==null||isNaN(+x)?d:+x;
const r2=n=>Math.round(n*100)/100;
const vehLabel=v=>v?([v.year,v.color,v.make,v.model].filter(Boolean).join(' ')||v.name||'Vehicle')+(v.plate?' · '+v.plate:''):'';
const vehName=v=>v?(v.name?v.name+' — ':'')+vehLabel(v):'';
const fuelPrice=v=>{const c=company();return v&&v.fuel==='Diesel'?numOr(c.dieselPrice,6.36):numOr(c.gasPrice,4.14)};
const mileRate=()=>numOr(company().mileRate,0.25);
function tripCalc(t){const veh=byId('vehicles',t.vehicleId);let mi=numOr(t.miles,0);
  if(t.startOdo!==''&&t.startOdo!=null&&t.endOdo!==''&&t.endOdo!=null&&+t.endOdo>=+t.startOdo)mi=+t.endOdo-+t.startOdo;
  const mpg=numOr(veh&&veh.mpg,0)||15,gp=fuelPrice(veh),pm=mileRate(),tolls=numOr(t.tolls,0);
  return{...t,miles:Math.round(mi*10)/10,tolls:r2(tolls),mpg,fuelPrice:gp,perMile:pm,vehicle:veh?vehLabel(veh):t.vehicle||'',gas:r2(mi/mpg*gp),wear:r2(mi*pm),total:r2(mi/mpg*gp+mi*pm+tolls)}}
const tripsCost=j=>(j.trips||[]).reduce((a,t)=>a+(+t.total||0),0);
const VDOC_TYPES=['Insurance card','Registration','Inspection sticker','E-ZPass','Driver license','Title','Other'];
const VEXP=[['regExp','Registration'],['inspExp','Inspection'],['insExp','Insurance'],['ezpassExp','E-ZPass'],['driverLicExp','Driver license']];
const daysTo=d=>Math.round((new Date(d+'T12:00')-new Date(today()+'T12:00'))/864e5);
function xp(label,d){if(!d)return `<span class="xp none">${label}: —</span>`;const n=daysTo(d);
  return `<span class="xp ${n<0?'bad':n<=30?'soon':'ok'}" title="${esc(label)} expires ${fdate(d)}">${label}: ${n<0?'EXPIRED '+fdate(d):n===0?'today':n<=30?n+' days':fdate(d)}</span>`}

function oilStatus(x){const tr=allTrips().filter(t=>t.vehicleId===x.id);const reads=[x.odometer,x.oilOdo,...tr.map(t=>t.endOdo)].filter(n=>n!==''&&n!=null&&!isNaN(+n)).map(Number);
  const odo=reads.length?Math.max(...reads):null;const byOdo=odo!=null&&x.oilOdo!=null&&x.oilOdo!==''?odo-+x.oilOdo:0;
  const byTrips=tr.filter(t=>!x.oilDate||t.date>=x.oilDate).reduce((a,t)=>a+(+t.miles||0),0);const since=Math.max(byOdo,byTrips);
  const em=+x.oilEveryMiles||3000,mo=+x.oilEveryMonths||3;const due=x.oilDate?addMonths(x.oilDate,mo):null;
  const leftMi=em-since,leftD=due?daysTo(due):9999;const set=!!(x.oilDate||(x.oilOdo!==''&&x.oilOdo!=null));
  return{odo,since:Math.round(since),due,leftMi:Math.round(leftMi),leftD,set,stage:!set?null:leftMi<=0||leftD<=0?'due':leftMi<=300||leftD<=7?'soon':'ok'}}
function oilBadge(x){const o=oilStatus(x);if(!o.set)return '<span class="xp none">Oil: not set</span>';
  return `<span class="xp ${o.stage==='due'?'bad':o.stage==='soon'?'soon':'ok'}" title="${o.since} mi since last change${o.due?' · due by '+fdate(o.due):''}">Oil: ${o.stage==='due'?'DUE NOW':'due in '+Math.max(0,o.leftMi).toLocaleString()+' mi'+(o.due?' or by '+fdate(o.due):'')}</span>`}
const vehAlerts=()=>S.vehicles.filter(x=>x.active!==false).flatMap(x=>[...VEXP.filter(([k])=>x[k]&&daysTo(x[k])<=30).map(([k,l])=>({x,l,d:x[k],n:daysTo(x[k])})),...(['due','soon'].includes(oilStatus(x).stage)?[{x,oil:1,n:oilStatus(x).stage==='due'?-1:5}]:[])]).sort((a,b)=>a.n-b.n);

   <tr><td colspan="4"><b>Vehicle cost for this job</b></td><td class="r"><b>${tot('miles').toFixed(1)}</b></td><td class="r">${money(tot('tolls'))}</td><td class="r">${money(tot('gas'))}</td><td class="r">${money(tot('wear'))}</td><td class="r"><b>${money(tot('total'))}</b></td><td></td></tr></table>`

   <div class="card kpi"><div class="l">Truck cost (${money(mileRate())}/mi)</div><div class="v">${money(sum(tr,'wear'))}</div></div>
   <div class="card kpi"><div class="l">Tolls</div><div class="v">${money(sum(tr,'tolls'))}</div></div>
   <div class="card kpi"><div class="l">Total vehicle cost</div><div class="v">${money(tot)}</div><div class="s">${mi?money(tot/mi)+' per mile':''}</div></div></div>
  ${vehAlerts().length?`<div class="card" style="border-left:4px solid var(--bad);margin-bottom:14px"><h3>⚠️ Needs attention</h3>${vehAlerts().map(a=>`<div class="click" style="padding:4px 0" onclick="openVeh('${a.x.id}')"><b>${esc(a.x.name||vehLabel(a.x))}</b> — ${a.oil?oilBadge(a.x):xp(a.l,a.d)}</div>`).join('')}</div>`:''}
  <div class="card"><h3>Trucks</h3>${vrows.length?`<table><tr><th>Truck</th><th>Year / Make / Model</th><th>Color</th><th>Plate</th><th>Driver</th><th>Fuel · MPG</th><th>Papers</th><th class="r">Odometer</th><th class="r">Miles</th><th class="r">Cost</th></tr>
   ${vrows.map(({x,ts,lo})=>`<tr class="click" onclick="openVeh('${x.id}')" style="opacity:${x.active===false?.5:1}"><td><b>${esc(x.name||'—')}</b></td><td>${esc([x.year,x.make,x.model].filter(Boolean).join(' '))}</td><td>${esc(x.color||'')}</td><td>${esc(x.plate||'')}</td><td>${esc(x.driverName||(x.techId?techName(x.techId):'—'))}${x.driverId?`<div class="small mut">ID ${esc(x.driverId)}</div>`:''}</td><td>${esc(x.fuel||'Gas')} · ${esc(x.mpg||'15')}</td><td>${VEXP.filter(([k])=>!['ezpassExp','driverLicExp'].includes(k)||x[k]).map(([k,l])=>xp(l==='Registration'?'Reg':l==='Inspection'?'Insp':l==='Insurance'?'Ins':l==='E-ZPass'?'EZ':'License',x[k])).join('')}${oilBadge(x)}<div class="small mut">${(x.docs||[]).length} docs</div></td><td class="r">${oilStatus(x).odo!=null?oilStatus(x).odo.toLocaleString():'—'}</td><td class="r">${sum(ts,'miles').toFixed(0)}</td><td class="r">${money(sum(ts,'total'))}</td></tr>`).join('')}</table>`:'<div class="empty">No trucks yet — click “+ Add Vehicle”.</div>'}</div>
  ${byTech.length?`<div class="card" style="margin-top:14px"><h3>By technician</h3><table><tr><th>Tech</th><th class="r">Trips</th><th class="r">Miles</th><th class="r">Tolls</th><th class="r">Total cost</th></tr>${byTech.map(r=>`<tr><td>${esc(r[0])}</td><td class="r">${r[1]}</td><td class="r">${r[2].toFixed(0)}</td><td class="r">${money(r[3])}</td><td class="r">${money(r[4])}</td></tr>`).join('')}</table></div>`:''}
  <div class="card" style="margin-top:14px"><h3>Mileage log</h3>${tr.length?`<table class="small"><tr><th>Date</th><th>Job</th><th>Customer</th><th>Tech</th><th>Vehicle</th><th class="r">Miles</th><th class="r">Tolls</th><th class="r">Gas</th><th class="r">Truck</th><th class="r">Total</th></tr>
   ${tr.map(x=>`<tr class="click" onclick="openJob('${x.job.id}')"><td class="nowrap">${fdate(x.date)}</td><td>${esc(x.job.number)}</td><td>${esc(custName(x.job.customerId))}</td><td>${esc(x.techName||techName(x.techId))}</td><td>${esc(x.vehicle||'')}</td><td class="r">${(+x.miles||0).toFixed(1)}</td><td class="r">${money(x.tolls)}</td><td class="r">${money(x.gas)}</td><td class="r">${money(x.wear)}</td><td class="r"><b>${money(x.total)}</b></td></tr>`).join('')}</table>`:'<div class="empty">No mileage in this period</div>'}</div>`}
function exportTrips(){const f=UI.flFrom||today().slice(0,8)+'01',t=UI.flTo||today();
  exportCSV(`mileage-${f}-to-${t}.csv`,[['Date','Job','Customer','Tech','Vehicle','Start odometer','End odometer','Miles','GPS miles','MPG','Fuel $/gal','Gas $','Per mile $','Truck $','Tolls $','Total $','Note'],
   ...allTrips().filter(x=>x.date>=f&&x.date<=t).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(x=>[x.date,x.job.number,custName(x.job.customerId),x.techName||techName(x.techId),x.vehicle,x.startOdo,x.endOdo,x.miles,x.gpsMiles,x.mpg,x.fuelPrice,x.gas,x.perMile,x.wear,x.tolls,x.total,x.note])])}
function openVeh(id){const x=id?{...byId('vehicles',id)}:{id:uid(),active:true,fuel:'Gas'};edit={col:'vehicles',obj:x};const g=mpgGuess(x.make,x.model);
  modal(`<h2>${id?esc(x.name||vehLabel(x)):'New Vehicle'}<button class="sm" onclick="closeM()">✕</button></h2>
  <div class="fg"><div><label>Truck name / #</label><input id="f_name" value="${esc(x.name)}" placeholder="Truck 1"></div><div><label>Year</label><input id="f_year" inputmode="numeric" value="${esc(x.year)}"></div><div><label>Color</label><input id="f_color" value="${esc(x.color)}" placeholder="White"></div>
  <div><label>Make</label><input id="f_make" list="vmakes" value="${esc(x.make)}" oninput="vehMpgHint()" placeholder="Ford"></div><div><label>Model</label><input id="f_model" value="${esc(x.model)}" oninput="vehMpgHint()" placeholder="Transit 250"></div><div><label>Plate #</label><input id="f_plate" value="${esc(x.plate)}"></div>
  <div><label>Fuel</label><select id="f_fuel">${opts(['Gas','Diesel'],x.fuel||'Gas')}</select></div><div><label>MPG</label><input id="f_mpg" inputmode="decimal" value="${esc(x.mpg)}" placeholder="${g||15}"><div class="small mut" id="vmpg">${g?`Estimated for this model: ${g} mpg — leave blank to use it`:'Enter the truck’s MPG (default 15)'}</div></div>
  <div><label>Assigned technician</label><select id="f_techId"><option value="">— none —</option>${crew().map(c=>`<option value="${c.id}" ${c.id===x.techId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
  <div class="span2"><label>VIN</label><input id="f_vin" value="${esc(x.vin)}"></div><div><label>Status</label><select id="f_active">${opts(['Active','Inactive'],x.active===false?'Inactive':'Active')}</select></div>
  <div class="span3"><label>Notes</label><input id="f_notes" value="${esc(x.notes)}"></div></div>
  <div class="sec">Driver</div><div class="fg"><div><label>Driver name</label><input id="f_driverName" value="${esc(x.driverName||(x.techId?techName(x.techId):''))}"></div><div><label>Driver license / ID #</label><input id="f_driverId" value="${esc(x.driverId)}" autocomplete="off"></div><div><label>License expires</label><input type="date" id="f_driverLicExp" value="${esc(x.driverLicExp)}"></div></div>
  <div class="sec">Registration & Inspection</div><div class="fg"><div><label>Registration date</label><input type="date" id="f_regDate" value="${esc(x.regDate)}"></div><div><label>Registration expires</label><input type="date" id="f_regExp" value="${esc(x.regExp)}"></div><div><label>Inspection expires</label><input type="date" id="f_inspExp" value="${esc(x.inspExp)}"></div></div>
  <div class="sec">E-ZPass</div><div class="fg"><div class="span2"><label>E-ZPass tag #</label><input id="f_ezpassTag" value="${esc(x.ezpassTag)}"></div><div><label>Tag expires</label><input type="date" id="f_ezpassExp" value="${esc(x.ezpassExp)}"></div></div>
  <div class="sec">Insurance</div><div class="fg"><div><label>Insurance company</label><input id="f_insCompany" value="${esc(x.insCompany)}"></div><div class="span2"><label>Policy #</label><input id="f_insPolicy" value="${esc(x.insPolicy)}"></div><div><label>Policy start</label><input type="date" id="f_insStart" value="${esc(x.insStart)}"></div><div><label>Policy expires</label><input type="date" id="f_insExp" value="${esc(x.insExp)}"></div></div>
  <div class="sec">Oil change</div><div class="fg"><div><label>Last oil change</label><input type="date" id="f_oilDate" value="${esc(x.oilDate)}"></div><div><label>Odometer at oil change</label><input id="f_oilOdo" inputmode="decimal" value="${esc(x.oilOdo)}"></div><div><label>Current odometer</label><input id="f_odometer" inputmode="decimal" value="${esc(x.odometer)}" placeholder="${(oilStatus(x).odo??'')}"><div class="small mut">Updates itself from techs’ odometer entries</div></div>
   <div><label>Change every (miles)</label><input id="f_oilEveryMiles" inputmode="numeric" value="${esc(x.oilEveryMiles||3000)}"></div><div><label>…or every (months)</label><input id="f_oilEveryMonths" inputmode="numeric" value="${esc(x.oilEveryMonths||3)}"></div>
   <div><label>Status</label><div style="padding-top:8px">${oilBadge(x)} ${oilStatus(x).set?`<div class="small mut">${oilStatus(x).since} mi since last change</div>`:''}</div></div></div>
  <div style="margin-top:6px"><button class="sm" onclick="oilDone()">🛢️ Oil changed today</button> <span class="small mut">fills today’s date and current odometer — then Save</span></div>
  <p class="small mut" style="margin-top:6px">Admins and office get a 🔔 reminder 30 days and 7 days before anything expires, on the day, and the day after if it wasn’t renewed — and when an oil change is coming up (300 mi / 7 days left) or due.</p>
  <div class="sec">Papers (insurance card, registration, inspection sticker…)</div><div id="vdocs">${vdocsHtml(x)}</div>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px"><select id="vd_type" style="max-width:190px">${opts(VDOC_TYPES,'Insurance card')}</select>
   <label class="btn sm" style="cursor:pointer">📎 Upload photo / PDF<input type="file" accept="image/*,application/pdf" multiple style="display:none" onchange="vdocUpload(this.files)"></label><span class="small mut" id="vd_msg"></span></div>
  <datalist id="vmakes">${[...new Set(Object.keys(MPG_DB).map(n=>n.split(' ')[0]))].map(m=>`<option value="${m}">`).join('')}</datalist>
  <div class="mfoot">${id?`<button class="danger" onclick="delVeh('${x.id}')">Delete</button>`:''}<span class="sp"></span><button onclick="closeM()">Cancel</button><button class="pri" onclick="saveVeh()">Save</button></div>`)}
function oilDone(){el('f_oilDate').value=today();const o=v('f_odometer')||oilStatus(edit.obj).odo;if(o!=null&&o!=='')el('f_oilOdo').value=o;else toast('Enter the odometer reading too');}
function vehMpgHint(){const g=mpgGuess(v('f_make'),v('f_model'));el('f_mpg').placeholder=g||15;el('vmpg').textContent=g?`Estimated for this model: ${g} mpg — leave blank to use it`:'Enter the truck’s MPG (default 15)'}
function vdocsHtml(x){const d=x.docs||[];return d.length?`<table class="small">${d.map(f=>`<tr><td><b>${esc(f.type)}</b></td><td>${esc(f.name)}</td><td class="mut">${fdate(f.at)}${f.by?' · '+esc(f.by):''}</td><td class="r nowrap"><button class="sm" onclick="vdocOpen('${f.id}')">View</button> <button class="sm" onclick="vdocDel('${f.id}')">✕</button></td></tr>`).join('')}</table>`:'<p class="small mut">No papers uploaded yet.</p>'}
async function vdocUpload(files){if(!files||!files.length)return;const type=v('vd_type');const msg=el('vd_msg');
  if(!byId('vehicles',edit.obj.id)){if(!(await saveVeh(true)))return}
  const cur=JSON.parse(JSON.stringify(byId('vehicles',edit.obj.id)));cur.docs=cur.docs||[];
  for(const f of files){if(f.size>15*1024*1024){toast(f.name+' is over 15 MB');continue}msg.textContent='Uploading '+f.name+'…';
    const doc={id:uid(),type,name:f.name,size:f.size,mime:f.type,at:new Date().toISOString(),by:me&&me.name||''};
    try{if(sb){const path=cur.id+'/'+Date.now()+'-'+f.name.replace(/[^\w.\-]+/g,'_').slice(-80);const{error}=await sb.storage.from('vehicle-docs').upload(path,f,{contentType:f.type||undefined});if(error)throw error;doc.path=path}
      else{doc.url=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
      cur.docs.push(doc)}catch(e){toast('Upload failed: '+sbErr(e))}}
  msg.textContent='';try{await save('vehicles',cur);edit.obj.docs=cur.docs;el('vdocs').innerHTML=vdocsHtml(cur);toast('Uploaded')}catch(e){}}
async function vdocOpen(id){const f=(edit.obj.docs||[]).find(d=>d.id===id);if(!f)return;
  if(f.url){const w=window.open();if(w)w.document.write(f.mime==='application/pdf'?`<iframe src="${f.url}" style="border:0;width:100%;height:100%"></iframe>`:`<img src="${f.url}" style="max-width:100%">`);return}
  const w=window.open('about:blank');const{data,error}=await sb.storage.from('vehicle-docs').createSignedUrl(f.path,600);if(error){if(w)w.close();toast(sbErr(error));return}if(w)w.location=data.signedUrl;else location.href=data.signedUrl}
async function vdocDel(id){const cur=JSON.parse(JSON.stringify(byId('vehicles',edit.obj.id)||edit.obj));const f=(cur.docs||[]).find(d=>d.id===id);if(!f||!confirm(`Delete ${f.type} — ${f.name}?`))return;
  if(sb&&f.path){const{error}=await sb.storage.from('vehicle-docs').remove([f.path]);if(error){toast(sbErr(error));return}}
  cur.docs=cur.docs.filter(d=>d.id!==id);try{await save('vehicles',cur);edit.obj.docs=cur.docs;el('vdocs').innerHTML=vdocsHtml(cur);toast('Deleted')}catch(e){}}
async function saveVeh(keep){const x=grab({...edit.obj},['name','year','color','make','model','plate','fuel','mpg','techId','vin','notes','regDate','regExp','inspExp','ezpassTag','ezpassExp','insCompany','insPolicy','insStart','insExp','oilDate','oilOdo','odometer','oilEveryMiles','oilEveryMonths','driverName','driverId','driverLicExp']);
  ['oilOdo','odometer','oilEveryMiles','oilEveryMonths'].forEach(k=>{x[k]=x[k]===''||x[k]==null?null:+String(x[k]).replace(/[^0-9.]/g,'')});if(!x.oilEveryMiles)x.oilEveryMiles=3000;if(!x.oilEveryMonths)x.oilEveryMonths=3;
  {const pv=byId('vehicles',x.id);if(!pv||pv.oilDate!==x.oilDate||pv.oilOdo!==x.oilOdo)x.oilAlert=null}{const cur=byId('vehicles',x.id);if(cur)x.docs=cur.docs||[]}x.active=v('f_active')==='Active';
  if(!x.make&&!x.name){toast('Enter a truck name or make');return false}x.year=x.year?parseInt(x.year)||null:null;x.mpg=x.mpg?+x.mpg:(mpgGuess(x.make,x.model)||15);x.techId=x.techId||null;
  try{await save('vehicles',x);if(keep){edit.obj={...x};return true}closeM();toast('Vehicle saved');return true}catch(e){return false}}
async function delVeh(id){if(!confirm('Delete this vehicle? Past mileage stays on the jobs. (Tip: set it Inactive instead to keep it in reports.)'))return;await remove('vehicles',id);closeM();toast('Vehicle deleted')}

/* ================= MODAL ================= */
function modal(h){$('#modal').innerHTML=h;$('#ov').classList.add('show');$('#ov').scrollTop=0;hydratePhotos();const t=document.querySelector('#modal .thr');if(t)t.scrollTop=t.scrollHeight}
function closeM(){$('#ov').classList.remove('show');$('#modal').innerHTML=''}
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeM()});
$('#ov2').addEventListener('mousedown',e=>{if(e.target.id==='ov2')closeM2()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#ov2').classList.contains('show'))closeM2();else closeM()}});
let pendingDel=null;
function delRec(col,id){if(pendingDel===col+id){remove(col,id);closeM();toast('Deleted');pendingDel=null}else{pendingDel=col+id;toast('Click Delete again to confirm');setTimeout(()=>pendingDel=null,3000)}}

route();init();
</script>
</body>
</html>
