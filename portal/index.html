<script>

const DEMO=!CFG.supabaseUrl||!CFG.supabaseAnonKey;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toLocaleString('en-US',{style:'currency',currency:'USD'});
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ymd(d)};
const fdate=s=>{if(!s)return '';const d=new Date(String(s).slice(0,10)+'T12:00');return isNaN(d)?'':d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})};
const ftime=t=>{if(!t)return '';let[h,m]=String(t).split(':');h=+h;return (h%12||12)+':'+m+(h<12?' AM':' PM')};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800)}
function badge(s){return `<span class="badge b-${esc(String(s).split(' ')[0])}">${esc(s)}</span>`}
const sub=items=>(items||[]).reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0);
const invTotal=i=>{const s=sub(i.items);return s+s*(+i.taxRate||0)/100};
const invPaid=i=>(i.payments||[]).reduce((a,p)=>a+(+p.amount||0),0);
const invBal=i=>Math.max(0,invTotal(i)-invPaid(i));
const invStatus=i=>{if(invBal(i)<=0.005)return 'Paid';if(i.due&&i.due<today())return 'Overdue';return invPaid(i)>0?'Partial':'Due'};

/* ===================== DATA ===================== */
let api;

      {id:'i1',number:'INV-5021',customerId:'c1',jobNumber:'J-1041',site:'120 Oak St, Edison, NJ',service:{date:addDays(t,-6),type:'Service Call',techs:'Jim',description:'RTU-2 not cooling, east wing warm.',notes:'Found failed run capacitor on condenser fan motor. Replaced capacitor, verified operation and pressures.',start:addDays(t,-6)+'T12:05:00Z',finish:addDays(t,-6)+'T13:15:00Z',hours:1.17},date:addDays(t,-6),due:addDays(t,24),taxRate:6.625,items:[{desc:'Service call – first hour',qty:1,price:195},{desc:'Run capacitor 45/5 MFD',qty:1,price:145}],payments:[]},

function supabaseApi(){
  const sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey);
  const rpc=async(fn,args={})=>{const{data,error}=await sb.rpc(fn,args);if(error)throw new Error(error.message);return data};
  const J=r=>r||[];
  return{
    demo:false,
    async session(){const{data}=await sb.auth.getSession();if(!data.session)return null;await rpc('portal_autolink').catch(()=>0);const me=await rpc('client_me');return me&&me.customers&&me.customers.length?me:{...me,unlinked:true}},
    async sendLink(email){const r=await fetch(CFG.supabaseUrl+'/functions/v1/portal-login',{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.supabaseAnonKey},body:JSON.stringify({email})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not send the code — please try again')},
    async register(r){await rpc('portal_register',{p_name:r.name,p_company:r.company||'',p_phone:r.phone||'',p_address:r.address})},
    async sendSignup(email){const r=await fetch(CFG.supabaseUrl+'/functions/v1/portal-login',{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.supabaseAnonKey},body:JSON.stringify({email,signup:true})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Could not send the code — please try again')},
    async verify(email,token){const{error}=await sb.auth.verifyOtp({email,token,type:'email'});if(error)throw new Error('That code didn’t work — check it or request a new one')},
    async signOut(){await sb.auth.signOut()},
    async load(){const me=await rpc('client_me');const[jobs,invoices,estimates,equipment,agreements,requests]=await Promise.all(['client_jobs','client_invoices','client_estimates','client_equipment','client_agreements','client_requests'].map(f=>rpc(f)));
      const sms=await rpc('client_sms_status').catch(()=>({optIn:false,phone:''}));
      return{me,customers:me.customers||[],jobs:J(jobs),invoices:J(invoices),estimates:J(estimates),equipment:J(equipment),agreements:J(agreements),requests:J(requests),sms:sms||{optIn:false,phone:''}}},
    async setSms(optIn,phone){await rpc('client_set_sms',{p_opt_in:optIn,p_phone:phone})},
    async decide(id,optIdx,approve,name){await rpc('client_estimate_decide',{p_id:id,p_option:optIdx,p_approve:approve,p_name:name})},
    async decideAgr(id,tier,approve,name){await rpc('client_agreement_decide',{p_id:id,p_tier:tier,p_approve:approve,p_name:name})},
    async notifs(){const{data,error}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(50);if(error)throw new Error(error.message);return data||[]},
    async markRead(ids){let q=sb.from('notifications').update({read_at:new Date().toISOString()}).is('read_at',null);if(ids)q=q.in('id',ids);await q},
    onNotif(fn){const ch=sb.channel('portal-bell').on('postgres_changes',{event:'*',schema:'public',table:'notifications'},()=>fn()).subscribe();return()=>sb.removeChannel(ch)},

/* ---------- Estimates ---------- */
const TIER_N={1:'Tier 1 — Basic',2:'Tier 2 — Standard',3:'Tier 3 — Comprehensive'};
const TIER_D={1:'Filters, belts, condensate drains and pans, visual inspection, thermostats, water leaks.',2:'Everything in Tier 1 plus lubrication / greasing, electrical components, fan motors and blowers, amp draws, refrigerant pressures, dampers, controls and safeties.',3:'Everything in Tier 2 plus chemical coil cleaning, compressor tests, superheat / subcooling, combustion analysis, heat exchanger and burner, cooling tower and strainer cleaning, and a full diagnostic report.'};
function agContracts(){const cs=(D.agreements||[]).filter(inLoc).filter(a=>a.status==='Sent'||(a.tiers&&Object.keys(a.tiers).length));

let tpick=null;
function openAgrP(id,keep){const a=(D.agreements||[]).find(x=>x.id===id);if(!a)return;const open=a.status==='Sent';if(!keep)tpick=+a.tier||2;
  const ts=Object.keys(a.tiers||{}).map(Number).sort();const show=open?ts:[+a.tier||ts[0]].filter(Boolean);
  modal(`<h2><span>Maintenance Contract ${esc(a.number)}</span><button class="sm" onclick="closeM()">✕</button></h2>
  <div class="row small mut" style="margin-bottom:10px"><span>${esc(a.freq||'')} visits</span><span>${fdate(a.start)} – ${fdate(a.end)}</span>${a.site?`<span>${esc(a.site)}</span>`:''}${badge(open?'Awaiting approval':a.status)}</div>

  ${(a.units||[]).length?`<p class="small"><b>Equipment covered:</b> ${a.units.map(esc).join(', ')}</p>`:''}
  ${open?'<p class="small" style="margin:10px 0 4px"><b>Choose your service level:</b></p>':''}
  ${show.map(t=>{const x=a.tiers[t]||{};const sel=open?tpick===t:+a.tier===t;return `<div class="opt ${sel?'sel':''}" onclick="${open?`tpick=${t};openAgrP('${a.id}',1)`:''}"><div class="row"><b style="font-size:17px">${TIER_N[t]}</b>${!open&&+a.tier===t?'<span class="badge b-Approved">Selected</span>':''}<span class="sp"></span><span class="price">${money(x.price)}<span class="small mut">/yr</span></span></div>
   <div class="small mut">${TIER_D[t]}</div>${x.first?`<div class="small" style="margin-top:6px">${+a.initial?`First payment ${money(x.first)} (includes ${money(a.initial)} first major maintenance), then `:''}${x.count>1?`${x.count-1} payments of ${money(x.next)}`:''} — ${esc((a.plan||'').toLowerCase())}</div>`:''}</div>`}).join('')}
  ${open?`<div class="card" style="background:#fafbfd"><label style="margin-top:0">Your name</label><input id="apn" value="${esc(D.me&&D.me.name||'')}" placeholder="Full name">
   <label style="display:flex;gap:8px;align-items:flex-start;font-weight:500;color:var(--txt)"><input type="checkbox" id="apc" style="width:auto;margin-top:3px"> I have read the maintenance contract and authorize ${esc(CFG.company)} to provide the selected service level at the price and payment schedule shown. This counts as my signature.</label>
   <div class="row" style="margin-top:12px"><button onclick="decideAgr('${a.id}',false)">Decline</button><span class="sp"></span><button class="grn" onclick="decideAgr('${a.id}',true)">✓ Approve ${tpick?TIER_N[tpick]:''}</button></div></div>`
  :a.approvedBy?`<p class="small">${a.status==='Declined'?'Declined':'Approved'} by <b>${esc(a.approvedBy)}</b> on ${fdate(a.approvedAt)}.</p>`:''}`)}
async function decideAgr(id,approve){const name=$('#apn').value.trim();if(approve&&!tpick){toast('Choose a service level');return}if(!name){toast('Please enter your name');return}if(approve&&!$('#apc').checked){toast('Please check the authorization box');return}
  try{await api.decideAgr(id,approve?tpick:null,approve,name);closeM();await refresh();toast(approve?'Approved — thank you! We’ll schedule your first visit.':'Contract declined. Thank you for letting us know.')}catch(err){toast(err.message||'Something went wrong')}}
function vEstimates(){const es=D.estimates.filter(inLoc).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

function openEst(id,keep){const e=D.estimates.find(x=>x.id===id);if(!e)return;const open=e.status==='Sent';if(!keep)pick=null;pick=open?(e.options.length===1?0:pick):e.selected;

   <div class="row" style="margin-top:12px"><button onclick="decide('${e.id}',false)">Decline</button><span class="sp"></span><button class="grn" onclick="decide('${e.id}',true)">✓ Approve ${pick!=null&&e.options[pick]?esc(e.options[pick].name):'selected option'}</button></div></div>`

async function decide(id,approve){const e=D.estimates.find(x=>x.id===id);const name=$('#apn').value.trim();

  return `<h1>Request Service</h1><p class="sub">Tell us what’s going on and we’ll confirm a time with you.${CFG.phone?` For emergencies (no heat, no cooling in a care area, leaks) please also call <b>${esc(CFG.phone)}</b>.`:''}</p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"><div class="card">
   ${custs.length>1?`<label style="margin-top:0">Location</label><select id="rq_c" onchange="loc=this.value;render()">${custs.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.company||c.name)}</option>`).join('')}</select>`:`<input type="hidden" id="rq_c" value="${esc(cid)}">`}
   ${(s=>s.length>1?`<label${custs.length>1?'':' style="margin-top:0"'}>Service address *</label><select id="rq_s">${s.map(x=>`<option value="${x.id}">${esc((x.name&&x.name!=='Main'?x.name+' — ':'')+x.address)}</option>`).join('')}</select>`:`<input type="hidden" id="rq_s" value="${s[0]?s[0].id:''}">`)(((custs.find(c=>c.id===cid)||{}).sites)||[])}
   <label>Equipment (if known)</label><select id="rq_e"><option value="">Not sure / general</option>${D.equipment.filter(e=>e.customerId===cid).map(e=>`<option value="${e.id}" ${e.id===eqSel?'selected':''}>${esc(e.tag||'')} ${esc(e.type||'')} ${e.location?'– '+esc(e.location):''}</option>`).join('')}</select>
   <label>What’s happening? *</label><textarea id="rq_d" placeholder="e.g. 2nd floor east wing is not getting heat; thermostat set to 72, reading 64."></textarea>
   <label>How urgent?</label><select id="rq_u"><option>Routine – within a few days</option><option>Soon – within 24 hours</option><option>Emergency – as soon as possible</option></select>
   <label>Preferred date</label><input type="date" id="rq_p" min="${today()}">
   <div class="row" style="gap:10px"><div style="flex:1;min-width:160px"><label>On-site contact</label><input id="rq_n" value="${esc(D.me&&D.me.name||'')}"></div><div style="flex:1;min-width:160px"><label>Phone</label><input id="rq_ph" type="tel"></div></div>
   <button class="pri" style="width:100%;margin-top:16px" id="rq_btn" onclick="submitReq()">Submit request</button></div>
   <div class="card"><h2>Your recent requests</h2>${reqs.length?`<table class="small">${reqs.map(r=>`<tr><td class="nowrap">${fdate(r.createdAt)}</td><td>${esc(r.description)}${multi()?`<div class="mut">${esc(locName(r.customerId))}</div>`:''}</td><td>${badge(r.status)}</td></tr>`).join('')}</table>`:'<div class="empty">No requests yet</div>'}</div></div>`}
async function submitReq(){const d=$('#rq_d').value.trim();if(d.length<5){toast('Please describe the problem');return}$('#rq_btn').disabled=true;
  try{await api.request({customerId:$('#rq_c').value,equipmentId:$('#rq_e').value,description:d,urgency:$('#rq_u').value,preferredDate:$('#rq_p').value,contact:$('#rq_n').value.trim(),phone:$('#rq_ph').value.trim(),siteId:($('#rq_s')||{}).value||''});window._eq='';await refresh();toast('Request received — we’ll be in touch shortly.')}
  catch(e){toast(e.message||'Could not submit — please call us');$('#rq_btn').disabled=false}}


/* ---------- Text message updates (consent) ---------- */
const SMS_CONSENT=()=>`Yes, text me. I agree to receive appointment confirmations, reminders, technician on-the-way updates and service notifications from ${esc(CFG.company)} at the mobile number above. Message frequency varies. Msg &amp; data rates may apply. Reply STOP to opt out, HELP for help. Consent is not a condition of service. See our <a href="https://korhvac.com/sms/" target="_blank">SMS Terms</a> and <a href="https://korhvac.com/privacy/" target="_blank">Privacy Policy</a>.`;
function smsCard(){const s=D.sms||{optIn:false,phone:''};
  return `<div class="card"><h2>📱 Text message updates</h2>${s.optIn?`<p class="small">You’ll get texts at <b>${esc(s.phone)}</b> when your visit is scheduled, the day before, when your technician is on the way (with a live tracking link), and when work is done.</p><button class="sm" onclick="setSms(false)">Stop text updates</button>`:
  `<p class="small mut" style="margin-top:0">Get a text when your technician is on the way — with a live map — plus appointment reminders.</p>
   <label style="margin-top:0">Mobile number</label><input id="sms_ph" type="tel" placeholder="(555) 555-5555" value="${esc(s.phone||'')}">
   <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--txt);font-size:12px;line-height:1.5"><input type="checkbox" id="sms_ok" style="width:auto;margin-top:2px"> <span>${SMS_CONSENT()}</span></label>
   <button class="pri" style="margin-top:10px" onclick="setSms(true)">Turn on text updates</button>`}</div>`}
async function setSms(on){try{if(on){const ph=$('#sms_ph').value.trim();if(!$('#sms_ok').checked){toast('Please check the box to agree to texts');return}await api.setSms(true,ph)}else await api.setSms(false,'');await refresh();toast(on?'Text updates are on':'Text updates are off')}catch(e){toast(e.message||'Could not save')}}
/* ---------- modal ---------- */
function modal(h){$('#modal').innerHTML=h;$('#ov').classList.add('show')}
function closeM(){$('#ov').classList.remove('show')}
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeM()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
boot();
</script>
</body>
</html>
