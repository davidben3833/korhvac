<style>

table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--mut);text-transform:uppercase}
tr.click{cursor:pointer}tr.click:hover{background:#f8f9fc}

.mb{background:#fff;border-radius:16px;max-width:760px;width:100%;padding:20px}

.ai{background:#f3f0ff;border:1px solid #ddd3ff;border-radius:10px;padding:8px 10px;font-size:13px}

  @media(max-width:640px){#lb .lbnav{display:none}#lb .lbtop{flex-wrap:wrap}}`;
  function el(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild}
  async function url(it){if(it.url)return it.url;it.url=await st.resolve(it.path);return it.url}
  function apply(){const i=st.img;if(!i)return;i.style.transform=`translate(calc(-50% + ${st.x}px),calc(-50% + ${st.y}px)) scale(${st.z})`;st.root.querySelector('.lbz').textContent=Math.round(st.z*100)+'%'}
  function zoom(f,cx,cy){const r=st.stage.getBoundingClientRect();cx=cx??r.width/2;cy=cy??r.height/2;const nz=Math.min(8,Math.max(1,st.z*f));const k=nz/st.z;
    st.x=(st.x-(cx-r.width/2))*k+(cx-r.width/2);st.y=(st.y-(cy-r.height/2))*k+(cy-r.height/2);st.z=nz;if(nz===1){st.x=0;st.y=0}apply()}
  async function show(i){const n=st.items.length;st.i=(i+n)%n;const it=st.items[st.i];st.z=1;st.x=0;st.y=0;
    const img=new Image();img.draggable=false;img.alt='';st.stage.querySelectorAll('img').forEach(x=>x.remove());st.stage.appendChild(img);st.img=img;apply();img.src=await url(it);
    st.root.querySelector('.lbn').textContent=`${st.i+1} / ${n}`;st.root.querySelector('.lbcap').innerHTML=(it.title?`<b>${it.title}</b> `:'')+(it.hidden?'<span class="lbtag">hidden from client</span> ':'')+(it.caption||'');
    st.root.querySelectorAll('.lbstrip img').forEach((t,k)=>{t.classList.toggle('on',k===st.i);if(k===st.i)t.scrollIntoView({block:'nearest',inline:'center'})});
    const act=st.root.querySelector('.lbact');act.innerHTML='';(st.actions||[]).forEach(a=>{const b=a.render?a.render(it):el(`<button>${a.label}</button>`);if(!a.render)b.onclick=()=>a.run(it,st.i);act.appendChild(b)});
    [st.i+1,st.i-1].forEach(k=>{const nx=st.items[(k+n)%n];if(nx&&!nx.url)url(nx)});
    const strip=st.root.querySelectorAll('.lbstrip img');[st.i-6,st.i+6].forEach(()=>{});strip.forEach(async(t,k)=>{if(Math.abs(k-st.i)<12&&!t.src)t.src=await url(st.items[k])})}
  function close(){if(!st)return;document.removeEventListener('keydown',st.key);st.root.remove();document.body.style.overflow=st.ov;const cb=st.onClose;st=null;cb&&cb()}
  function open(items,i,opt={}){if(!items||!items.length)return;close();
    if(!document.getElementById('lbcss')){const s=document.createElement('style');s.id='lbcss';s.textContent=css;document.head.appendChild(s)}
    const root=el(`<div id="lb"><div class="lbtop"><b class="lbn"></b><span class="sp"></span><span class="lbact" style="display:flex;gap:6px;flex-wrap:wrap"></span><button class="lbzo" title="Zoom out">−</button><span class="lbz" style="min-width:44px;text-align:center"></span><button class="lbzi" title="Zoom in">+</button><button class="lbx" title="Close (Esc)">✕</button></div>

    document.body.appendChild(root);st={items,i,root,stage:root.querySelector('.lbstage'),resolve:opt.resolve,actions:opt.actions,onClose:opt.onClose,z:1,x:0,y:0,ov:document.body.style.overflow};document.body.style.overflow='hidden';

    st.key=e=>{if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;if(e.key==='Escape')close();else if(e.key==='ArrowLeft')show(st.i-1);else if(e.key==='ArrowRight')show(st.i+1);else if(e.key==='+'||e.key==='=')zoom(1.5);else if(e.key==='-')zoom(1/1.5);else if(e.key==='0'){st.z=1;st.x=0;st.y=0;apply()}};document.addEventListener('keydown',st.key);

    const pts=new Map();let start=null;
    sg.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;sg.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});start={x:e.clientX,y:e.clientY,sx:st.x,sy:st.y,t:Date.now(),d:null,z:st.z};if(pts.size===2){const [a,b]=[...pts.values()];start.d=Math.hypot(a.x-b.x,a.y-b.y)}sg.classList.add('drag')});
    sg.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pts.size===2&&start.d){const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const r=sg.getBoundingClientRect();const f=(start.z*d/start.d)/st.z;zoom(f,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top)}
      else if(st.z>1){st.x=start.sx+(e.clientX-start.x);st.y=start.sy+(e.clientY-start.y);apply()}});
    const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);sg.classList.remove('drag');if(pts.size===0&&start&&st.z===1&&!start.d){const dx=e.clientX-start.x;if(Math.abs(dx)>50&&Date.now()-start.t<600)show(st.i+(dx<0?1:-1))}if(pts.size<2&&start)start.d=null};
    sg.addEventListener('pointerup',up);sg.addEventListener('pointercancel',up);
    show(i||0)}
  return{open,close,refresh:()=>st&&show(st.i),items:()=>st&&st.items,index:()=>st&&st.i,remove:(k)=>{if(!st)return;st.items.splice(k,1);if(!st.items.length)return close();st.root.querySelector('.lbstrip').children[k]?.remove();show(Math.min(k,st.items.length-1))}};
})();

async function loadThumbs(root=document){const ims=[...root.querySelectorAll('img[data-th]')].filter(e=>e.dataset.th);ims.forEach(e=>{if(urlCache[e.dataset.th])e.src=urlCache[e.dataset.th]});const need=[...new Set(ims.filter(e=>!urlCache[e.dataset.th]).map(e=>e.dataset.th))];

const urlCache={};async function thumb(path){if(!urlCache[path])urlCache[path]=await signed(path);return urlCache[path]}
async function shrink(file,max=1600){if(!file.type.startsWith('image/'))return file;const img=await createImageBitmap(file).catch(()=>null);if(!img)return file;const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',.85))}

function shell(inner){
  const nav=[['projects','Projects'],['suppliers','Suppliers']];
  $('#app').innerHTML=`<header><div class="hw"><b>KOR HVAC · Rebates</b><nav>${nav.map(([k,l])=>`<button data-nav="${k}" class="${V.page===k?'on':''}">${l}</button>`).join('')}</nav><span class="sp"></span>${['Office','Admin'].includes(ME.base)?'<a href="/app/" class="sm" style="color:#fff;margin-right:8px;text-decoration:none;border:1px solid #555;border-radius:6px;padding:4px 10px">← Office</a>':''}<span class="small" style="color:#bbb">${esc(ME.name)}</span><button class="sm" id="lo">Sign out</button></div></header>
  <main><div class="mnav">${nav.map(([k,l])=>`<button data-nav="${k}" class="sm ${V.page===k?'pri':''}">${l}</button>`).join('')}</div>${inner}</main>`;
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{V={page:b.dataset.nav};location.hash=b.dataset.nav;route()});
  $('#lo').onclick=async()=>{await sb.auth.signOut();loginView()};
}
function route(){
  const h=location.hash.slice(1);
  if(h.startsWith('p/')){V.page='project';V.pid=h.slice(2)}else if(h==='suppliers')V.page='suppliers';else V.page='projects';
  if(V.page==='project')return projectView();
  if(V.page==='suppliers')return suppliersView();
  projectsView();
}
window.onhashchange=()=>ME&&route();

/* ───────── projects ───────── */
function projectsView(){
  const f=V.f||'', st=V.st||'';
  const list=D.projects.filter(p=>(st==='__del'?!!p.deleted_at:!p.deleted_at)&&(!st||st==='__del'||p.stage===st)&&(!f||[p.number,p.title,p.site,p.company,p.program].join(' ').toLowerCase().includes(f.toLowerCase())));
  shell(`<div class="row" style="margin-bottom:12px"><h2 style="margin:0">Projects</h2><span class="sp"></span><button class="pri" id="np">+ New project</button></div>
  <div class="card"><div class="row" style="margin-bottom:10px"><input id="f" placeholder="Search…" value="${esc(f)}" style="max-width:280px"><select id="st" style="max-width:200px"><option value="">All stages</option>${STAGES.map(s=>`<option ${s===st?'selected':''}>${s}</option>`).join('')}${isAdm()&&D.projects.some(p=>p.deleted_at)?`<option value="__del" ${st==='__del'?'selected':''}>🗑 Deleted (${D.projects.filter(p=>p.deleted_at).length})</option>`:''}</select></div>
  <table><tr><th>#</th><th>Project</th><th>Site</th><th>Program / company</th><th>Stage</th><th>Survey</th></tr>
  ${list.map(p=>`<tr class="click" data-id="${p.id}"><td>${esc(p.number)}</td><td><b>${esc(p.title||'(untitled)')}</b></td><td>${esc(p.site||'')}</td><td>${esc([p.program,p.company].filter(Boolean).join(' · '))}</td><td><span class="b ${esc(p.stage)}">${esc(p.stage)}</span></td><td>${esc(p.survey_date||'')}</td></tr>`).join('')||'<tr><td colspan=6 class="mut">No projects yet.</td></tr>'}</table></div>`);
  $('#f').oninput=e=>{V.f=e.target.value;clearTimeout(V.t);V.t=setTimeout(()=>{projectsView();$('#f').focus();$('#f').setSelectionRange(99,99)},250)};
  $('#st').onchange=e=>{V.st=e.target.value;projectsView()};
  document.querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>location.hash='p/'+r.dataset.id);
  $('#np').onclick=()=>editProject();
}
function editProject(p={}){
  const m=modal(`<h3>${p.id?'Edit project':'New project'}</h3>
  <label>Project name</label><input id="t" value="${esc(p.title||'')}" placeholder="e.g. Sunrise Nursing Home – RTU replacement">
  <label>Site address</label><input id="s" value="${esc(p.site||'')}">
  <div class="g2"><div><label>Customer (optional)</label><select id="c"><option value="">—</option>${D.customers.map(c=>`<option value="${c.id}" ${c.id===p.customer_id?'selected':''}>${esc(c.company||c.name)}</option>`).join('')}</select></div>
  <div><label>Survey date</label><input id="d" type="date" value="${esc(p.survey_date||new Date().toISOString().slice(0,10))}"></div>
  <div><label>Rebate program</label><input id="pg" value="${esc(p.program||'')}" placeholder="e.g. NJ Clean Energy / PSE&G"></div>
  <div><label>Rebate company</label><input id="co" value="${esc(p.company||'')}"></div>
  <div><label>Application #</label><input id="an" value="${esc(p.app_no||'')}"></div>
  <div><label>Stage</label><select id="sg">${STAGES.map(s=>`<option ${s===(p.stage||'Survey')?'selected':''}>${s}</option>`).join('')}</select></div></div>
  <label>Notes</label><textarea id="n">${esc(p.notes||'')}</textarea>
  <div class="row" style="margin-top:14px"><button class="pri" id="sv">Save</button><button id="cx">Cancel</button></div>`);
  m.querySelector('#cx').onclick=()=>m.remove();
  m.querySelector('#sv').onclick=async()=>{
    const o={title:m.querySelector('#t').value.trim(),site:m.querySelector('#s').value.trim(),customer_id:m.querySelector('#c').value||null,survey_date:m.querySelector('#d').value||null,program:m.querySelector('#pg').value.trim()||null,company:m.querySelector('#co').value.trim()||null,app_no:m.querySelector('#an').value.trim()||null,stage:m.querySelector('#sg').value,notes:m.querySelector('#n').value.trim()||null,updated_at:new Date().toISOString()};
    if(!o.title)return toast('Add a project name');
    try{if(p.id){await q(sb.from('rebates').update(o).eq('id',p.id));if(o.stage!==p.stage)await event(p.id,`Stage → ${o.stage}`)}
      else{o.surveyor_id=ME.id;const r=await q(sb.from('rebates').insert(o).select().single());await event(r.id,'Project created');p=r}
      m.remove();await loadAll();location.hash='p/'+p.id;route()}catch(e){toast(e.message)}
  };
}

/* ───────── project ───────── */
async function projectView(){
  const p=D.projects.find(x=>x.id===V.pid);if(!p){location.hash='';return}
  const [units,reqs,files,events]=await Promise.all([
    q(sb.from('rebate_units').select('*').eq('rebate_id',p.id).order('created_at')),
    q(sb.from('supplier_requests').select('*').eq('rebate_id',p.id).order('created_at',{ascending:false})),
    q(sb.from('rebate_files').select('*').eq('rebate_id',p.id).order('created_at',{ascending:false})),
    q(sb.from('rebate_events').select('*').eq('rebate_id',p.id).order('at',{ascending:false}).limit(200))]);
  const opts=await q(sb.from('rebate_options').select('*').eq('rebate_id',p.id).order('sort')).catch(()=>[]);
  const items=opts.length?await q(sb.from('rebate_option_items').select('*').in('option_id',opts.map(o=>o.id))).catch(()=>[]):[];
  P={p,units,reqs,files,events,opts,items};
  if(chan)sb.removeChannel(chan);
  chan=sb.channel('rb-'+p.id).on('postgres_changes',{event:'*',schema:'public',table:'supplier_requests',filter:'rebate_id=eq.'+p.id},()=>refresh())
    .on('postgres_changes',{event:'*',schema:'public',table:'rebate_files',filter:'rebate_id=eq.'+p.id},()=>refresh()).subscribe();
  drawProject();
}
let rt;function refresh(){clearTimeout(rt);rt=setTimeout(async()=>{if(V.page==='project'&&!document.querySelector('.modal')){await loadAll();projectView()}},800)}
function drawProject(){
  const{p,units,reqs,files,events}=P, tab=V.tab||'survey';
  const cust=D.customers.find(c=>c.id===p.customer_id);
  const drafts=reqs.filter(r=>r.status==='Draft').length;
  shell(`<div class="row" style="margin-bottom:6px"><a href="#" id="bk">← Projects</a></div>
  <div class="card"><div class="row"><div><div class="mut small">${esc(p.number||'')}</div><h2 style="margin:2px 0">${esc(p.title||'')}</h2><div class="mut">${esc(p.site||'')}${cust?' · '+esc(cust.company||cust.name):''}</div>
  <div class="small mut">${esc([p.program,p.company,p.app_no&&('App # '+p.app_no)].filter(Boolean).join(' · '))}</div></div><span class="sp"></span>${p.deleted_at?'<span class="badge" style="background:#fde8e8;color:#c0392b">Deleted</span> <button class="sm" id="rst">Restore</button>':''}<button class="sm" id="ed">Edit</button>${isAdm()&&!p.deleted_at?' <button class="sm red" id="del">Delete</button>':''}</div>
  <div class="stage" style="margin-top:10px">${STAGES.map(s=>`<span class="${s===p.stage?'on':''}" data-stage="${s}" style="cursor:pointer">${s}</span>`).join('')}</div></div>
  <div class="tabs">${[['survey',`Survey (${units.length}) · 📷 ${files.filter(f=>f.kind==='Photo').length}`],['table','Unit table'],['options',`Options (${(P.opts||[]).length})${optIssues()?' ⚠️':''}`],['pricing',`Pricing (${reqs.length})${drafts?' · '+drafts+' to approve':''}`],['files',`Files (${files.filter(f=>f.kind!=='Photo').length})`],['activity','Activity']].map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>
  <div id="tb"></div>`);
  $('#bk').onclick=e=>{e.preventDefault();location.hash=''};
  $('#ed').onclick=()=>editProject(p);
  if($('#del'))$('#del').onclick=async()=>{const typed=prompt(`Delete ${p.number} — ${p.title||''}?\n\nThe partner will no longer see it. You can restore it later from Projects → 🗑 Deleted.\n\nType ${p.number} to confirm:`);if(typed===null)return;if(typed.trim().toUpperCase()!==String(p.number).toUpperCase()){toast('Not deleted — the number didn’t match');return}
    await q(sb.from('rebates').update({deleted_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',p.id));await event(p.id,'Project deleted');p.deleted_at=new Date().toISOString();toast(p.number+' deleted');location.hash=''};
  if($('#rst'))$('#rst').onclick=async()=>{await q(sb.from('rebates').update({deleted_at:null}).eq('id',p.id));await event(p.id,'Project restored');p.deleted_at=null;toast('Restored');route()};
  document.querySelectorAll('[data-stage]').forEach(s=>s.onclick=async()=>{if(s.dataset.stage===p.stage)return;await q(sb.from('rebates').update({stage:s.dataset.stage,updated_at:new Date().toISOString()}).eq('id',p.id));await event(p.id,'Stage → '+s.dataset.stage);await loadAll();projectView()});
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{V.tab=b.dataset.tab;drawProject()});
  ({survey:surveyTab,table:tableTab,options:optionsTab,pricing:pricingTab,files:filesTab,activity:activityTab})[tab]();
}

/* ===== UNIT TABLE — one row per unit, everything a supplier needs to price it ===== */
const UTYPES=['RTU','Condensing unit','Air handler','Furnace','Heat pump','Mini split','VRF','PTAC','Fan coil','DOAS / ERV','Boiler','Water heater','Storage tank','Pump','Fan / fan motor','Exhaust fan','Unit heater','Chiller','Cooling tower','Compressor','Expansion tank','Controls','Other'];
const SPEC=[['tag','Tag','col'],['equipment_type','Type','type'],['qty','Qty','col'],['make','Make','col'],['model','Model','col'],['serial','Serial','col'],['tonnage','Tons','col'],['voltage','Voltage','col'],['fuel','Fuel','col'],['refrigerant','Refrig.','col'],['mfg_year','Year','col'],['efficiency','Efficiency','col'],['warranty','Warranty','spec'],
 ['heat_in','Heat input (MBH)','spec'],['heat_out','Heat output (MBH)','spec'],['economizer','Economizer','yn'],['co2','CO₂ sensor','yn'],['enthalpy','Enthalpy sensor','yn'],['smoke','Smoke detector','yn'],['curb','Curb adapter','yn'],['spec_notes','Notes for supplier','spec']];
const uval=(u,[k,,t])=>(t==='col'||t==='type')?(u[k]??''):((u.specs||{})[k]??'');
const aiCell=(u,k)=>((u.specs||{}).ai_fields||[]).includes(k)?'background:#f3edff':'';
const GRP=t=>({'Split system':'Condensing unit','Mini split indoor':'Mini split','Mini split outdoor':'Mini split','Duct furnace':'Furnace'}[t]||t||'');
const GLABEL={'Condensing unit':'AC / Condensing units','Air handler':'AHU / Air handlers','RTU':'Rooftop units (RTU)','Boiler':'Boilers','Water heater':'Water heaters','Storage tank':'Storage tanks','Pump':'Pumps','Fan / fan motor':'Fans / fan motors','Exhaust fan':'Exhaust fans','Mini split':'Mini splits','Furnace':'Furnaces','Heat pump':'Heat pumps','Compressor':'Compressors','Unit heater':'Unit heaters','':'Not classified yet — press 🤖 Fill with AI'};
const SC=(k,l,t='spec')=>[k,l,t];
const GCOLS={
 'RTU':[SC('tonnage','Tons','col'),SC('fuel','Fuel','col'),SC('heat_in','Heat in (MBH)'),SC('heat_out','Heat out (MBH)'),SC('efficiency','Efficiency','col'),SC('refrigerant','Refrig.','col'),SC('economizer','Economizer','yn'),SC('co2','CO₂ sensor','yn'),SC('enthalpy','Enthalpy','yn'),SC('smoke','Smoke det.','yn'),SC('curb','Curb adapter','yn')],
 'Condensing unit':[SC('tonnage','Tons','col'),SC('refrigerant','Refrig.','col'),SC('efficiency','SEER/EER','col'),SC('paired_with','Paired with (AHU)')],
 'Heat pump':[SC('tonnage','Tons','col'),SC('refrigerant','Refrig.','col'),SC('efficiency','SEER2/HSPF2','col'),SC('paired_with','Paired with')],
 'Mini split':[SC('tonnage','Tons','col'),SC('heads','Indoor heads'),SC('head_type','Head type (wall/ceiling/ducted)'),SC('refrigerant','Refrig.','col'),SC('efficiency','SEER2','col')],
 'Air handler':[SC('tonnage','Tons','col'),SC('cfm','CFM'),SC('hp','Motor HP'),SC('orientation','Orientation','col'),SC('heat_type','Heat (elec/HW/steam/none)'),SC('paired_with','Paired with (CU)')],
 'Fan coil':[SC('tonnage','Tons','col'),SC('cfm','CFM'),SC('pipes','2 / 4 pipe'),SC('orientation','Orientation','col')],
 'Furnace':[SC('fuel','Fuel','col'),SC('heat_in','Heat in (MBH)'),SC('heat_out','Heat out (MBH)'),SC('efficiency','AFUE','col'),SC('cfm','CFM'),SC('orientation','Orientation','col')],
 'Boiler':[SC('boiler_kind','Hot water / Steam'),SC('fuel','Fuel','col'),SC('heat_in','Input (MBH)'),SC('heat_out','Output (MBH)'),SC('efficiency','AFUE / Eff.','col'),SC('venting','Venting')],
 'Water heater':[SC('fuel','Fuel','col'),SC('gallons','Gallons'),SC('heat_in','Input (MBH)'),SC('recovery','Recovery (GPH)'),SC('efficiency','UEF / Eff.','col'),SC('venting','Venting')],
 'Storage tank':[SC('gallons','Gallons'),SC('tank_kind','Indirect / storage'),SC('psi','Working PSI')],
 'Pump':[SC('gpm','GPM'),SC('head_ft','Head (ft)'),SC('hp','HP'),SC('rpm','RPM'),SC('phase','Phase'),SC('service','Service (heating/DHW/CHW)')],
 'Fan / fan motor':[SC('cfm','CFM'),SC('hp','HP'),SC('rpm','RPM'),SC('drive','Belt / direct'),SC('frame','Motor frame'),SC('phase','Phase')],
 'Exhaust fan':[SC('cfm','CFM'),SC('hp','HP'),SC('rpm','RPM'),SC('drive','Belt / direct'),SC('mount','Roof / wall / inline')],
 'Unit heater':[SC('fuel','Fuel','col'),SC('heat_in','Input (MBH)'),SC('cfm','CFM')],
 'Chiller':[SC('tonnage','Tons','col'),SC('refrigerant','Refrig.','col'),SC('efficiency','kW/ton','col'),SC('cooling','Air / water cooled')],
 'Compressor':[SC('tonnage','Tons','col'),SC('refrigerant','Refrig.','col'),SC('phase','Phase')],
};
const GDEF=[SC('tonnage','Tons','col'),SC('fuel','Fuel','col'),SC('heat_in','Input (MBH)'),SC('efficiency','Efficiency','col'),SC('refrigerant','Refrig.','col')];
const HEADC=[SC('tag','Tag','col'),SC('equipment_type','Type','type'),SC('qty','Qty','col'),SC('make','Make','col'),SC('model','Model','col'),SC('serial','Serial','col'),SC('mfg_year','Year','col'),SC('voltage','Voltage','col')];
const TAILC=[SC('warranty','Warranty'),SC('spec_notes','Notes for supplier')];
const colsFor=g=>[...HEADC,...(GCOLS[g]||GDEF),...TAILC];
function cellHTML(u,c){const v=uval(u,c),st=aiCell(u,c[0]);
  if(c[2]==='yn')return `<td><select data-u="${u.id}" data-k="${c[0]}" data-t="spec" style="min-width:70px;${st}"><option value=""></option>${['Yes','No','Existing'].map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select></td>`;
  if(c[2]==='type')return `<td><select data-u="${u.id}" data-k="${c[0]}" data-t="col" style="min-width:130px;${st}"><option value=""></option>${[...UTYPES,...(u.equipment_type&&!UTYPES.includes(u.equipment_type)?[u.equipment_type]:[])].map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select></td>`;
  return `<td><input data-u="${u.id}" data-k="${c[0]}" data-t="${c[2]}" value="${esc(v)}" style="min-width:${c[0]==='spec_notes'?220:['model','serial'].includes(c[0])?140:c[0]==='tag'?70:80}px;${st}"></td>`}
function tableTab(){const{units}=P;
  const by={};units.forEach(u=>{const g=GRP(u.equipment_type);(by[g]=by[g]||[]).push(u)});
  const order=[...UTYPES.filter(t=>by[t]),...Object.keys(by).filter(g=>g&&!UTYPES.includes(g)),...(by['']?['']:[])];
  const tip=u=>esc((u.specs||{}).ai_why?('AI: '+u.specs.ai_why+' ('+(u.specs.ai_conf||'')+')'+((u.specs||{}).year_how?'\nYear: '+u.specs.year_how:'')):'');
  $('#tb').innerHTML=`<div class="row" style="margin-bottom:10px;gap:8px;flex-wrap:wrap"><span class="mut small">One table per equipment type, with the specs that type needs. Changes save as you type. <span style="background:#f3edff;padding:1px 6px;border-radius:4px">Purple</span> = filled by AI, please check.</span><span class="sp"></span>
   <label class="small" style="text-transform:none;letter-spacing:0;margin:0;display:flex;gap:4px;align-items:center"><input type="checkbox" id="aiow" style="width:auto"> overwrite</label><button class="sm pri" id="aifill">🤖 Fill with AI</button><button class="sm" id="csv">⬇ Export CSV</button></div>
  <div class="small mut" id="aifst" style="margin-bottom:6px"></div>
  <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:10px">${order.map(g=>`<a href="#" class="badge" data-jump="${esc(g)}" style="text-decoration:none">${esc(GLABEL[g]||g)} · ${by[g].length}</a>`).join('')}</div>
  ${order.map(g=>{const C=colsFor(g);return `<div class="card" id="tg-${esc(g).replace(/\W/g,'_')}" style="margin-bottom:12px"><div class="row"><b>${esc(GLABEL[g]||g)}</b><span class="mut small">&nbsp;${by[g].length} unit${by[g].length===1?'':'s'}${by[g].reduce((a,u)=>a+(u.qty||1),0)!==by[g].length?' · qty '+by[g].reduce((a,u)=>a+(u.qty||1),0):''}</span></div>
   <div style="overflow-x:auto"><table class="small"><tr>${C.map(c=>`<th style="white-space:nowrap">${c[1]}</th>`).join('')}</tr>
   ${by[g].map(u=>`<tr title="${tip(u)}">${C.map(c=>cellHTML(u,c)).join('')}</tr>`).join('')}</table></div></div>`}).join('')}
  ${units.length?'':'<p class="mut">No units yet — add them in the Survey tab.</p>'}`;
  document.querySelectorAll('[data-jump]').forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById('tg-'+a.dataset.jump.replace(/\W/g,'_'));if(el)el.scrollIntoView({behavior:'smooth'})});
  document.querySelectorAll('#tb [data-u]').forEach(e=>e.onchange=async()=>{const u=P.units.find(x=>x.id===e.dataset.u),k=e.dataset.k,v=e.value.trim();let up;
    const sp={...(u.specs||{})};sp.ai_fields=(sp.ai_fields||[]).filter(x=>x!==k);
    if(e.dataset.t==='col'){up={[k]:k==='qty'?(parseInt(v)||1):k==='tonnage'?(parseFloat(v)||null):k==='mfg_year'?(parseInt(v)||null):v||null,specs:sp};Object.assign(u,up)}else{sp[k]=v;u.specs=sp;up={specs:sp}}e.style.background='';
    try{await q(sb.from('rebate_units').update({...up,updated_at:new Date().toISOString()}).eq('id',u.id));if(k==='equipment_type')return tableTab();e.style.background='#eefaf3';setTimeout(()=>e.style.background='',700)}catch(err){toast(err.message)}});
  $('#aifill').onclick=async()=>{const btn=$('#aifill');btn.disabled=true;const st=$('#aifst');let off=0,n=0;
    try{const{data:{session}}=await sb.auth.getSession();while(true){st.textContent=`🤖 Researching units ${off+1}–${Math.min(off+2,P.units.length)} of ${P.units.length} (nameplate → brand → serial year)…`;
      const r=await fetch(SB_URL+'/functions/v1/rebate-photomap',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},body:JSON.stringify({rebateId:P.p.id,action:'classify',offset:off,force:$('#aiow').checked})}).then(x=>x.json());
      if(r.error)throw new Error(r.error);n+=r.filled||0;if(r.done)break;off=r.next}
      await event(P.p.id,`AI filled unit details for ${n} unit(s)`);P.units=await q(sb.from('rebate_units').select('*').eq('rebate_id',P.p.id).order('created_at'));toast(`Done — ${n} units updated`);tableTab()}catch(e){toast(e.message);btn.disabled=false;st.textContent=''}};
  $('#csv').onclick=()=>{const all=[];[...HEADC,...Object.values(GCOLS).flat(),...GDEF,...TAILC].forEach(c=>{if(!all.some(x=>x[0]===c[0]))all.push(c)});const rows=[all.map(c=>c[1]),...P.units.map(u=>all.map(c=>uval(u,c)))];const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`${P.p.number||'units'} unit table.csv`;a.click()}}

/* ===== OPTIONS — each option assigns every unit to a supplier/model; quote, submittal and AHRI live on each unit inside the option ===== */
const RATE=[['seer2','SEER2'],['eer2','EER2'],['ieer','IEER'],['hspf2','HSPF2'],['afue','AFUE']];
function itemOf(oid,uid){return (P.items||[]).find(i=>i.option_id===oid&&i.unit_id===uid)}
function optCheck(o){const req=P.p.requirements||{},out={missing:[],low:[],nodocs:[],total:0,covered:0};
  P.units.forEach(u=>{const it=itemOf(o.id,u.id);const name=u.tag||u.equipment_type||'Unit';
    if(!it||!(it.model||'').trim()){out.missing.push(name);return}out.covered++;out.total+=(+it.price||0)*(u.qty||1);
    RATE.forEach(([k,l])=>{const need=+req[k],have=+((it.ratings||{})[k]);if(need&&have&&have<need)out.low.push(`${name}: ${l} ${have} < ${need}`);if(need&&!have)out.low.push(`${name}: ${l} not entered (program needs ${need})`)});
    const miss=[!it.submittal&&'submittal',!it.ahri&&'AHRI',!it.quote&&'quote'].filter(Boolean);if(miss.length)out.nodocs.push(`${name}: ${miss.join(', ')}`)});return out}

/* ===== Supplier map: which item goes to which supplier ===== */
function smapRender(){const el=$('#smap');if(!el)return;const{p,units}=P;const map=p.supplier_map||{};
  const sup=id=>D.suppliers.find(s=>s.id===id)||{company:'?'};
  let cols=[...new Set([...Object.values(map).flat().map(x=>x.id),...(V.smExtra||[])])].filter(id=>D.suppliers.some(s=>s.id===id));
  const has=(u,s)=>(map[u]||[]).some(x=>x.id===s), why=(u,s)=>((map[u]||[]).find(x=>x.id===s)||{}).why||'';
  const cnt=s=>units.filter(u=>has(u.id,s)).length;
  el.innerHTML=`<div class="row" style="gap:8px;flex-wrap:wrap"><b>🗺 Supplier map — what goes to who</b><span class="sp"></span>
   <button class="sm pri" id="smai">🤖 ${Object.keys(map).length?'Re-map':'Map items to suppliers'}</button>
   <select id="smadd" style="max-width:200px"><option value="">+ Add supplier column</option>${D.suppliers.filter(s=>s.active&&!cols.includes(s.id)).map(s=>`<option value="${s.id}">${esc(s.company)}</option>`).join('')}</select>
   ${cols.length?`<button class="sm grn" id="smdraft">✉ Draft one email per supplier (${cols.filter(c=>cnt(c)).length})</button>`:''}</div>
   <div class="small mut" style="margin:4px 0 8px">Each supplier only gets the items ticked in its column. Hover a tick to see why the AI picked it.</div>

   ${units.map(u=>`<tr><td><b>${esc(u.tag||'Unit')}</b> <span class="mut">${esc([u.equipment_type,u.make,u.model,u.tonnage?u.tonnage+'T':''].filter(Boolean).join(' · '))}</span></td>${cols.map(c=>`<td style="text-align:center" title="${esc(why(u.id,c))}"><input type="checkbox" style="width:auto" data-smu="${u.id}" data-sms="${c}" ${has(u.id,c)?'checked':''}></td>`).join('')}</tr>`).join('')}</table></div>`:'<div class="mut small">Not mapped yet.</div>'}`;

  $('#smadd').onchange=e=>{if(!e.target.value)return;V.smExtra=[...(V.smExtra||[]),e.target.value];smapRender()};
  $('#smai').onclick=async e=>{if(!units.length)return toast('Add units first');e.target.disabled=true;e.target.textContent='🤖 Mapping…';
    try{const r=await fn('rebate-photomap',{rebateId:P.p.id,action:'supplier_map'});P.p.supplier_map=r.map;toast('Mapped — check the ticks');smapRender()}catch(err){toast(err.message);e.target.disabled=false}};
  if($('#smdraft'))$('#smdraft').onclick=async e=>{const groups={};for(const[u,l]of Object.entries(P.p.supplier_map||{}))for(const x of l)(groups[x.id]=groups[x.id]||[]).push(u);
    if(!Object.keys(groups).length)return toast('Tick at least one item');if(!confirm(`Draft ${Object.keys(groups).length} pricing email(s)? Nothing is sent until you approve each one.`))return;
    e.target.disabled=true;e.target.textContent='Drafting…';try{const r=await fn('rebate-photomap',{rebateId:P.p.id,action:'draft',groups});toast(`${r.drafted} draft(s) ready for approval`);await projectView()}catch(err){toast(err.message);e.target.disabled=false}};

async function approve(r,btn){if(!canP('rebate_approve'))return toast('You don’t have permission to send supplier emails — ask an Admin');

  try{await fn('rebate-mail',{action:'send',id:r.id});toast('Sent');}catch(e){toast(e.message)}
  projectView();
}

  <div class="row" style="margin-top:14px">${ro?'':'<button class="pri" id="sv">Save draft</button>'+(canP('rebate_approve')?'<button class="grn" id="sd">Approve & send</button>':'')}<button id="cx">Close</button></div>`);
  const sel=m.querySelector('#s');sel.onchange=()=>{const s=D.suppliers.find(x=>x.id===sel.value);if(s)m.querySelector('#to').value=s.email||''};
  m.querySelector('#cx').onclick=()=>m.remove();
  if(ro)return;
  const save=async()=>{const o={supplier_id:sel.value||null,to_addr:m.querySelector('#to').value.trim(),cc:m.querySelector('#cc').value.trim()||null,subject:m.querySelector('#sj').value.trim(),body:m.querySelector('#bd').value,unit_ids:[...m.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value),status:'Draft',updated_at:new Date().toISOString()};
    if(!o.supplier_id||!o.to_addr||!o.subject||!o.body.trim())throw new Error('Supplier, To, subject and message are required');
    if(r.id){await q(sb.from('supplier_requests').update(o).eq('id',r.id));return{...r,...o}}const n=await q(sb.from('supplier_requests').insert({...o,rebate_id:P.p.id}).select().single());return n};
  m.querySelector('#sv').onclick=async()=>{try{await save();m.remove();projectView()}catch(e){toast(e.message)}};
  if(m.querySelector('#sd'))m.querySelector('#sd').onclick=async()=>{try{const n=await save();m.remove();approve(n)}catch(e){toast(e.message)}};
}

  if($('#aimap'))$('#aimap').onclick=async()=>{const b=$('#aimap');b.disabled=true;const st=$('#aimapst');
    try{const{data:{session}}=await sb.auth.getSession();const call=body=>fetch(SB_URL+'/functions/v1/rebate-photomap',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+session.access_token},body:JSON.stringify({rebateId:P.p.id,...body})}).then(x=>x.json());
      while(true){const r=await call({action:'describe',batch:12});if(r.error)throw new Error(r.error);if(r.done)break;st.textContent=`Step 1 — looking at each photo… ${r.total-r.left} of ${r.total}`}
      let win=0,placed=0;while(true){st.textContent=`Step 2 — matching photos to units… ${win}`;const r=await call({action:'assign',win});if(r.error)throw new Error(r.error);placed+=r.placed||0;if(r.done)break;win=r.next}
      st.textContent='Step 3 — looking for equipment that is not in the survey yet (water heaters, pumps, fans…)';const d=await call({action:'discover'});if(d.error)throw new Error(d.error);
      if(d.added){let off=0;const U=(await q(sb.from('rebate_units').select('id').eq('rebate_id',P.p.id))).length;while(true){st.textContent=`Step 4 — reading the new units' nameplates… ${Math.min(off+2,U)} of ${U}`;const c=await call({action:'classify',offset:off});if(c.error||c.done)break;off=c.next}}
      await event(P.p.id,`AI sorted ${placed} photo(s) into units${d.added?`, found ${d.added} new unit(s)`:''}`);toast(`Done — ${placed} photos filed${d.added?`, ${d.added} new unit(s) added`:''}`);projectView()}catch(e){toast(e.message);b.disabled=false}};
}
async function dlFile(u,name){try{const b=await fetch(u).then(r=>r.blob());const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name||'file';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}catch(e){toast('Download failed')}}
const DOCK=[['Proposal','📝 Proposals'],['Submittal','📐 Submittals'],['AHRI','🏷 AHRI certificates'],['Application','📋 Applications'],['Pre-approval','✅ Pre-approvals'],['Quote','💲 Supplier quotes & pricing (internal — never shown to the client)'],['Invoice','🧾 Invoices (internal)'],['Other','📄 Other']];
function docView(f){const m=document.createElement('div');m.style.cssText='position:fixed;inset:0;background:rgba(10,12,16,.92);z-index:9998;display:flex;flex-direction:column';
  m.innerHTML=`<div style="display:flex;align-items:center;gap:8px;padding:10px 14px;color:#fff"><b style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</b><button class="sm" id="dvo">⤓ Download</button><button class="sm" id="dvx">✕ Close</button></div><div style="flex:1;background:#fff"><div class="mut" style="padding:20px">Loading…</div></div>`;
  document.body.appendChild(m);const close=()=>{m.remove();document.removeEventListener('keydown',k)};const k=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',k);
  m.querySelector('#dvx').onclick=close;signed(f.path).then(u=>{if(!u)return;m.querySelector('#dvo').onclick=()=>dlFile(u,f.name);
    const box=m.lastElementChild;if(/pdf/i.test(f.mime||f.name))box.innerHTML=`<iframe src="${u}#view=FitH" style="width:100%;height:100%;border:0"></iframe>`;else if(/^image\//.test(f.mime||''))box.innerHTML=`<img src="${u}" style="max-width:100%;max-height:100%;display:block;margin:auto">`;else box.innerHTML=`<div style="padding:24px">This file type can't be previewed here. <a href="${u}" target="_blank">Download it</a>.</div>`})}
function filesTab(){
  const{p}=P;const docs=P.files.filter(f=>f.kind!=='Photo');const kinds=DOCK.map(k=>k[0]);
  const grp=DOCK.map(([k,l])=>({k,l,list:docs.filter(f=>(kinds.includes(f.kind)?f.kind:'Other')===k)})).filter(g=>g.list.length);
  $('#tb').innerHTML=`<div class="row" style="margin-bottom:12px;gap:8px;flex-wrap:wrap"><b>Documents (${docs.length})</b><span class="small mut">Photos are in the Survey tab.</span><span class="sp"></span><select id="k" style="max-width:180px">${DOCK.map(([k])=>`<option ${k==='Submittal'?'selected':''}>${k}</option>`).join('')}</select><button class="pri" id="up">⬆ Upload documents</button><input type="file" id="ff" multiple hidden></div>
  ${grp.map(g=>`<div class="card" style="padding:12px;margin-bottom:12px"><div class="row"><b>${g.l}</b><span class="sp"></span><span class="small mut">${g.list.length}</span></div>
    ${g.list.map(f=>`<div class="row" style="padding:8px 0;border-top:1px solid var(--line);gap:10px"><span style="font-size:20px">${/pdf/i.test(f.mime||f.name)?'📄':/sheet|xls/i.test(f.mime||f.name)?'📊':/^image/.test(f.mime||'')?'🖼':'📎'}</span><a href="#" data-dv="${f.id}" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</a>${f.hidden?'<span class="badge">hidden</span>':''}<span class="small mut" style="white-space:nowrap">${f.size?Math.max(1,Math.round(f.size/1024))+' KB · ':''}${when(f.created_at)}</span>
      <select data-dk="${f.id}" class="sm" style="max-width:130px">${DOCK.map(([k])=>`<option ${(kinds.includes(f.kind)?f.kind:'Other')===k?'selected':''}>${k}</option>`).join('')}</select><button class="sm red" data-x="${f.id}" title="Delete">🗑</button></div>`).join('')}</div>`).join('')||'<div class="card mut">No documents yet.</div>'}`;
  document.querySelectorAll('[data-dv]').forEach(a=>a.onclick=e=>{e.preventDefault();docView(P.files.find(f=>f.id===a.dataset.dv))});
  document.querySelectorAll('[data-dk]').forEach(sel=>sel.onchange=async()=>{await q(sb.from('rebate_files').update({kind:sel.value}).eq('id',sel.dataset.dk));P.files.find(f=>f.id===sel.dataset.dk).kind=sel.value;toast('Moved to '+sel.value);filesTab()});
  $('#up').onclick=()=>$('#ff').click();
  $('#ff').onchange=async e=>{for(const f of e.target.files){try{const path=`${p.id}/files/${Date.now()}-${f.name.replace(/[^\w.\- ]+/g,'_')}`;const{error}=await sb.storage.from('rebate-files').upload(path,f,{contentType:f.type});if(error)throw error;await q(sb.from('rebate_files').insert({rebate_id:p.id,name:f.name,path,mime:f.type,size:f.size,kind:/^image\//.test(f.type)&&!/pric|quote/i.test(f.name)?'Photo':$('#k').value}))}catch(err){toast(err.message)}}await event(p.id,`Uploaded ${e.target.files.length} file(s)`);projectView()};
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{const f=P.files.find(x=>x.id===b.dataset.x);if(!confirm(`Delete ${f.name}?`))return;await sb.storage.from('rebate-files').remove([f.path]);await q(sb.from('rebate_files').delete().eq('id',f.id));projectView()});
}
function activityTab(){
  $('#tb').innerHTML=`<div class="card"><div class="row"><input id="nt" placeholder="Add a note…"><button class="pri" id="an">Add</button></div></div>
  <div class="card">${P.events.map(e=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="small mut">${when(e.at)} · ${esc(e.who||'')}</span><div>${esc(e.text)}</div></div>`).join('')||'<span class="mut">Nothing yet.</span>'}</div>`;
  $('#an').onclick=async()=>{const t=$('#nt').value.trim();if(!t)return;await event(P.p.id,t);projectView()};
}

/* ───────── suppliers ───────── */
function suppliersView(){
  shell(`<div class="row" style="margin-bottom:12px"><h2 style="margin:0">Suppliers</h2><span class="sp"></span>${canP('suppliers')?'<button class="pri" id="ns">+ Add supplier</button>':''}</div>
  <div class="row" style="margin-bottom:10px"><span class="mut small">The AI picks suppliers from this list by equipment type, brand and region (from each supplier's line card), and learns from who replies and quotes.</span><span class="sp"></span>${canP('suppliers')?'<button class="sm" id="lcall">🔎 Update all line cards</button>':''}</div><div class="small mut" id="lcst"></div>
  <div class="card" style="overflow:auto"><table><tr><th>Company</th><th>Contact</th><th>Equipment</th><th>Brands</th><th>Regions</th><th>Record</th></tr>
  ${D.suppliers.map(s=>`<tr class="click" data-s="${s.id}" style="${s.active?'':'opacity:.5'}"><td><b>${esc(s.company)}</b>${s.line_card?.summary?`<div class="small mut" style="max-width:260px">${esc(s.line_card.summary)}</div>`:''}${s.website?`<div class="small"><a href="${esc(/^https?:/.test(s.website)?s.website:'https://'+s.website)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(s.website.replace(/^https?:\/\//,''))}</a></div>`:''}</td><td class="small">${esc(s.contact_name||'')}<br>${esc(s.email||'')}</td><td class="small">${esc((s.categories||[]).join(', '))}</td><td class="small">${esc((s.brands||[]).join(', '))}</td><td class="small">${esc((s.regions||[]).join(', '))}</td>
  <td class="small">${s.stats?.sent?`${s.stats.sent} sent · ${s.stats.quoted||0} quoted${s.stats.avgReplyHrs!=null?' · ~'+s.stats.avgReplyHrs+'h reply':''}`:'<span class="mut">new</span>'}</td></tr>`).join('')}</table></div>`);
  if($('#ns'))$('#ns').onclick=()=>editSupplier({active:true});
  if($('#lcall'))$('#lcall').onclick=async e=>{e.target.disabled=true;const L=D.suppliers.filter(s=>s.active);let i=0;for(const s of L){i++;$('#lcst').textContent=`🔎 ${i}/${L.length} — ${s.company}…`;try{await fn('rebate-photomap',{action:'linecard',supplier_id:s.id})}catch(err){}}await loadAll();suppliersView();toast('Line cards updated')};
  document.querySelectorAll('[data-s]').forEach(r=>r.onclick=()=>editSupplier(D.suppliers.find(s=>s.id===r.dataset.s)));
}
function editSupplier(s){
  const arr=v=>(v||[]).join(', '), split=v=>v.split(',').map(x=>x.trim()).filter(Boolean);
  const m=modal(`<h3>${s.id?'Supplier':'New supplier'}</h3><div class="g2">
  <div><label>Company</label><input id="c" value="${esc(s.company||'')}"></div><div><label>Contact name</label><input id="n" value="${esc(s.contact_name||'')}"></div>
  <div><label>Email</label><input id="e" type="email" value="${esc(s.email||'')}"></div><div><label>Phone</label><input id="p" value="${esc(s.phone||'')}"></div></div>
  <label>Equipment types (comma separated)</label><input id="cat" value="${esc(arr(s.categories))}" placeholder="RTU, Split system, Boiler, PTAC…">
  <label>Brands</label><input id="br" value="${esc(arr(s.brands))}"><label>Regions / states</label><input id="rg" value="${esc(arr(s.regions))}" placeholder="NJ, NY, MA">
  <label>Notes (the AI reads these)</label><textarea id="nt">${esc(s.notes||'')}</textarea>
  <label>Website</label><input id="ws" value="${esc(s.website||'')}" placeholder="lionhvac.com">
  ${s.line_card?`<div class="ai" style="margin-top:8px"><b>Line card</b> (${esc(String(s.line_card.updated_at||'').slice(0,10))}): ${esc(s.line_card.summary||'')}${s.line_card.branches?'<br>Branches: '+esc(s.line_card.branches):''}</div>`:''}
  ${s.id&&canP('suppliers')?'<button class="sm" id="lc1" style="margin-top:6px">🔎 Look up what they sell</button>':''}
  ${s.learned?.quoted?`<div class="ai">Learned: quoted ${esc(Object.entries(s.learned.quoted).map(([k,v])=>k+' ×'+v).join(', '))}</div>`:''}
  <label style="text-transform:none"><input type="checkbox" id="ac" style="width:auto" ${s.active!==false?'checked':''}> Active</label>
  <div class="row" style="margin-top:14px">${canP('suppliers')?'<button class="pri" id="sv">Save</button>':''}<button id="cx">Close</button></div>`);
  m.querySelector('#cx').onclick=()=>m.remove();
  if(m.querySelector('#sv'))m.querySelector('#sv').onclick=async()=>{const o={company:m.querySelector('#c').value.trim(),contact_name:m.querySelector('#n').value.trim()||null,email:m.querySelector('#e').value.trim()||null,phone:m.querySelector('#p').value.trim()||null,categories:split(m.querySelector('#cat').value),brands:split(m.querySelector('#br').value),regions:split(m.querySelector('#rg').value),notes:m.querySelector('#nt').value.trim()||null,website:m.querySelector('#ws').value.trim()||null,active:m.querySelector('#ac').checked,updated_at:new Date().toISOString()};
    if(!o.company)return toast('Company is required');
    try{let nid=s.id;if(s.id)await q(sb.from('suppliers').update(o).eq('id',s.id));else nid=(await q(sb.from('suppliers').insert({...o,source:'manual'}).select('id').single())).id;m.remove();await loadAll();suppliersView();
      if(!s.id){toast('Saved — looking up what they sell…');fn('rebate-photomap',{action:'linecard',supplier_id:nid}).then(async()=>{await loadAll();if(V.page==='suppliers')suppliersView();toast(o.company+': line card added')}).catch(err=>toast('Line card: '+err.message))}}catch(e){toast(e.message)}};
  if(m.querySelector('#lc1'))m.querySelector('#lc1').onclick=async e=>{e.target.disabled=true;e.target.textContent='🔎 Searching the web…';try{await fn('rebate-photomap',{action:'linecard',supplier_id:s.id});m.remove();await loadAll();suppliersView();editSupplier(D.suppliers.find(x=>x.id===s.id))}catch(err){toast(err.message);e.target.disabled=false}};
}
boot();
</script>
</body>
